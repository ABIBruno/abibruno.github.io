:root{
  --paper:#eef2f1; --paper2:#e3e9e7; --surface:#ffffff;
  --ink:#1f2430; --ink2:#566070; --thread:#a3abb8; --line:rgba(31,36,48,.12); --line2:rgba(31,36,48,.24);
  --roth:#7fa8d9; --roth-s:#e4eef8; --roth-d:#29507e;
  --skin:#e6be55; --skin-s:#fbf2d6; --skin-d:#6e500e;
  --hen:#86bc9a; --hen-s:#e3f1e8; --hen-d:#28603f;
  --nav:#7c8aa8; --nav-s:#e8ecf3; --nav-d:#3d4966;
  --display:'Bricolage Grotesque', 'Atkinson Hyperlegible', system-ui, sans-serif;
  --body:'Atkinson Hyperlegible', system-ui, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--body);background:var(--paper);color:var(--ink);font-size:17px;line-height:1.6;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--nav-d);outline-offset:3px}
.ic{display:inline-block;width:1em;height:1em;vertical-align:-.14em;flex:none}
.ic svg{width:100%;height:100%;display:block}
.emo{display:inline-block;flex:none}
.emo svg{width:100%;height:100%;display:block}


/* ---------- Hintergrund: Farbkreise je Philosoph ---------- */
.bgfx{position:fixed;inset:0;overflow:hidden;z-index:0;background:#e1f3ea;transition:background-color .8s cubic-bezier(.65,0,.35,1);pointer-events:none}
.bgfx .bc{position:absolute;border-radius:50%;transform:translate(-50%,-50%) scale(1);transition:transform .8s cubic-bezier(.65,0,.35,1), opacity .5s ease .1s}
.bgfx .bc::after{content:"";position:absolute;inset:11.7%;border-radius:50%;border:2px solid;border-color:inherit;transition:opacity .4s ease}
.bgfx .bc-roth{left:18%;top:35%;width:42vw;aspect-ratio:1;background:rgba(127,168,217,.26);border-color:rgba(127,168,217,.6)}
.bgfx .bc-skinner{left:82%;top:35%;width:42vw;aspect-ratio:1;background:rgba(230,190,85,.28);border-color:rgba(230,190,85,.7)}
.bgfx .bc-henecka{left:50%;top:79%;width:44vw;aspect-ratio:1;background:rgba(134,188,154,.28);border-color:rgba(134,188,154,.7)}
.bgfx[data-k] .bc{opacity:0;transform:translate(-50%,-50%) scale(1.9)}
.bgfx[data-k] .bc.on{opacity:1}
@media (prefers-reduced-motion: reduce){.bgfx,.bgfx .bc{transition:none}}

/* ---------- Bühne ---------- */
.viewport{position:fixed;inset:0;overflow:hidden;background:transparent}
.stage{position:absolute;inset:0;transform-origin:50% 50%}
.stage svg.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.stage svg.links path,.stage svg.links line{vector-effect:non-scaling-stroke}
.stage.fadeaway{transition:transform .8s cubic-bezier(.65,0,.35,1), opacity .5s ease .1s;transform:scale(1.9);opacity:0;pointer-events:none}
.stage.start{transform:scale(1.9);opacity:0;transition:none}
.stage.arrive{transition:transform .8s cubic-bezier(.65,0,.35,1), opacity .6s ease .15s}

.topbar{position:fixed;top:clamp(10px,2vmin,24px);left:clamp(10px,2vmin,28px);right:clamp(10px,2vmin,28px);display:flex;align-items:center;gap:12px;z-index:20;pointer-events:none}
.topbar > *{pointer-events:auto}
.topbar .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:clamp(13px,1.55vmin,17px);background:var(--surface);border:1.5px solid var(--line2);border-radius:999px;padding:7px 15px;cursor:pointer;color:var(--ink)}
.pill:hover{border-color:var(--ink)}
.pill.strong{border-color:var(--ink);font-weight:700}
.where{font-size:clamp(13px,1.5vmin,17px);color:var(--ink2)}
.where b{color:var(--cd)}
.bottombar{position:fixed;bottom:clamp(10px,2vmin,24px);left:0;right:0;display:flex;justify-content:center;align-items:center;gap:14px;z-index:20;pointer-events:none;flex-wrap:wrap;padding:0 12px}
.bottombar > *{pointer-events:auto}
.credits{position:fixed;left:clamp(10px,2vmin,28px);bottom:clamp(8px,1.6vmin,20px);z-index:20;pointer-events:none;font-size:clamp(10px,1.25vmin,13px);line-height:1.35;color:var(--ink2);white-space:nowrap}
.credits b{font-weight:700;color:var(--ink)}
@media (max-width:1180px){.bottombar{padding-left:140px;padding-right:140px}}
@media (max-width:700px){.credits{font-size:10px}.bottombar{padding-left:110px;padding-right:12px}}
.hint{font-size:clamp(12px,1.45vmin,16px);color:var(--ink2);pointer-events:none!important}
.action{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:clamp(15px,2vmin,22px);border-radius:16px;padding:clamp(9px,1.3vmin,15px) clamp(16px,2.4vmin,28px);cursor:pointer;border:2px solid var(--cd);background:var(--surface);color:var(--cd)}
.action.main{background:var(--cd);color:#fff}
.action .ic{font-size:1.15em}

/* ---------- Zentrum: das Spielkreuz ---------- */
.hub{position:absolute;transform:translate(-50%,-50%);text-align:center;z-index:2;width:min(64vmin,720px)}
.hub .cross{display:block;width:clamp(120px,19vmin,230px);margin:0 auto clamp(6px,1.2vmin,14px)}
.hub h1{font-family:var(--display);font-weight:800;font-variation-settings:'wdth' 82;font-size:clamp(34px,7.4vmin,96px);line-height:.92;letter-spacing:-.02em}
.hub p{font-size:clamp(14px,2vmin,22px);color:var(--ink2);margin-top:clamp(8px,1.4vmin,16px);line-height:1.35}
.hub button{margin-top:clamp(10px,1.6vmin,18px)}

/* ---------- Porträts ---------- */
.pframe{display:block;position:relative;width:var(--pw);aspect-ratio:1;margin:0 auto}
.portrait{display:block;width:100%;height:100%;border-radius:50%;border:4px solid var(--c);background:var(--cs);overflow:hidden;box-shadow:0 0 0 8px var(--paper),0 0 0 9px var(--line)}
.pwrap{position:relative;display:block;width:100%;height:100%;border-radius:50%;overflow:hidden}
.pwrap > svg{position:absolute;inset:0;width:100%;height:100%}
.pwrap img.foto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s ease}
.pwrap img.foto.ok{opacity:1}
.badge{position:absolute;right:-4%;bottom:-2%;width:33%;aspect-ratio:1;border-radius:50%;background:var(--surface);border:3px solid var(--c);display:flex;align-items:center;justify-content:center;z-index:3}
.badge svg{width:68%;height:68%}
.ph{--pw:min(27vmin,330px);position:absolute;transform:translate(-50%,calc(var(--pw) / -2));background:none;border:none;cursor:pointer;text-align:center;width:calc(var(--pw) * 1.45)}
.ph .portrait{transition:transform .25s ease}
.ph:hover .portrait{transform:scale(1.03)}
.ph:focus-visible{outline:none}
.ph:focus-visible .portrait{outline:3px solid var(--cd);outline-offset:10px}
.ph .name{display:block;font-family:var(--display);font-weight:750;font-variation-settings:'wdth' 85;font-size:clamp(21px,3.9vmin,48px);line-height:1;margin-top:clamp(12px,2vmin,22px);letter-spacing:-.01em}
.ph .field{display:block;font-size:clamp(13px,1.7vmin,19px);color:var(--cd);margin-top:4px}
.ph .tagline{display:block;margin-top:clamp(4px,.8vmin,10px);font-size:clamp(13px,1.8vmin,20px);color:var(--ink2);font-style:italic}
.stage svg.threads{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.linklabel{position:absolute;transform:translate(-50%,-50%);font-size:clamp(12px,1.5vmin,17px);color:var(--ink2);font-style:italic;white-space:nowrap;background:var(--paper);padding:0 8px}

.flyer{position:absolute;z-index:5;border-radius:50%;border:4px solid;overflow:hidden;background:var(--surface);pointer-events:none}
.flyer .pwrap{width:100%;height:100%}

/* ---------- Detail ---------- */
.hubph{--pw:min(30vmin,360px);position:absolute;transform:translate(-50%,calc(var(--pw) / -2));width:calc(var(--pw) * 1.3);text-align:center;pointer-events:none}
.hubph .name,.hubph .field,.hubph .badge{opacity:0;transition:opacity .4s ease}
.stage.ready .hubph .name,.stage.ready .hubph .field,.stage.ready .hubph .badge{opacity:1}
.hubph .name{font-family:var(--display);font-weight:800;font-variation-settings:'wdth' 82;font-size:clamp(24px,4.6vmin,56px);margin-top:clamp(12px,1.8vmin,20px);line-height:1}
.hubph .name,.hubph .field{display:inline-block;background:var(--paper);padding:0 14px;border-radius:10px}
.hubph .field{font-size:clamp(13px,1.7vmin,19px);color:var(--cd)}
@keyframes land{0%{box-shadow:0 0 0 8px var(--paper),0 0 0 9px var(--line)}40%{box-shadow:0 0 0 14px var(--paper),0 0 0 18px var(--c)}100%{box-shadow:0 0 0 8px var(--paper),0 0 0 9px var(--line)}}
.hubph .portrait.land{animation:land .6s ease}

.node{position:absolute;transform:translate(-50%,-50%);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;
  padding:clamp(9px,1.4vmin,16px) clamp(12px,1.8vmin,20px) clamp(9px,1.4vmin,16px) clamp(9px,1.3vmin,14px);cursor:pointer;
  display:flex;align-items:center;gap:clamp(10px,1.4vmin,16px);text-align:left;width:clamp(170px,28vmin,350px);opacity:0;
  transition:left .6s cubic-bezier(.2,.9,.3,1.15), top .6s cubic-bezier(.2,.9,.3,1.15), opacity .35s ease, border-color .15s ease}

.node .n{flex:none;width:clamp(36px,5vmin,58px);height:clamp(36px,5vmin,58px);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,2.6vmin,30px);color:var(--cd);background:var(--cs)}
.node .t{display:block;font-family:var(--display);font-weight:700;font-variation-settings:'wdth' 90;font-size:clamp(16px,2.4vmin,28px);line-height:1.08}
.node .h{display:block;font-size:clamp(12px,1.55vmin,18px);color:var(--ink2);line-height:1.3;margin-top:3px}

/* ---------- Vollbild-Seiten ---------- */
.page{position:fixed;inset:0;z-index:40;background:var(--paper);overflow:hidden;display:flex;flex-direction:column;opacity:0;transform:scale(.6);pointer-events:none;transition:opacity .35s ease, transform .45s cubic-bezier(.2,.8,.2,1)}
.page.show{opacity:1;transform:none;pointer-events:auto}
.phead{position:relative;flex:none;z-index:3;background:color-mix(in srgb, var(--paper) 94%, transparent);backdrop-filter:blur(6px);border-bottom:1.5px solid var(--line);padding:clamp(10px,1.6vmin,16px) clamp(14px,3vw,48px);display:flex;align-items:center;gap:clamp(12px,1.8vmin,20px)}
.phead .face{flex:none;width:clamp(40px,5.6vmin,62px);height:clamp(40px,5.6vmin,62px);border-radius:50%;overflow:hidden;border:3px solid var(--c)}
.phead .face .pwrap{width:100%;height:100%}
.phead .who{font-size:clamp(13px,1.5vmin,16px);color:var(--cd)}
.phead h2{font-family:var(--display);font-weight:800;font-variation-settings:'wdth' 85;font-size:clamp(26px,4.4vmin,52px);line-height:1;letter-spacing:-.015em}
.phead .spacer{flex:1}
.pbody{flex:1;overflow:auto;width:100%;max-width:1240px;margin:0 auto;padding:clamp(20px,3.4vmin,44px) clamp(14px,3vw,48px) 60px;font-size:clamp(16px,1.8vmin,21px)}
/* ---------- Inhaltsseite ---------- */
.sheet{flex:1;min-height:0;width:min(1640px,calc(100% - 2*clamp(12px,3vw,48px)));margin:clamp(10px,1.8vmin,22px) auto 0;font-size:clamp(14px,1.6vmin,19px);position:relative}
.sin{position:absolute;inset:0;display:flex;flex-direction:column;gap:clamp(12px,2vmin,26px);overflow:hidden}
.sheet.narrow .sin{overflow-y:auto}
.stop{flex:none}
.stop .hero{margin:0;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(18px,3vmin,44px)}
.stop .vis{min-height:0;padding:clamp(12px,2vmin,26px)}
.stop .vis svg.full{max-height:min(30vh,320px)}
.stop .bigemo{width:clamp(80px,14vmin,170px);height:clamp(80px,14vmin,170px)}
.stop .chain .st .emo{width:clamp(56px,9vmin,110px);height:clamp(56px,9vmin,110px)}
.stop .lead .big{font-size:clamp(24px,3.4vmin,42px)}
.stop .lead p{font-size:1.08em}
.flow{flex:1;min-height:0;column-gap:clamp(22px,3.4vmin,48px);column-fill:balance;overflow:hidden;column-rule:1.5px solid var(--line)}
.sheet.narrow .flow{overflow:visible;flex:none}
.flow > *{break-inside:avoid;margin:0 0 clamp(14px,2vmin,24px)!important}
.flow > .sec{break-inside:auto}
.flow > .sec:has(.scenebox),.flow > .sec:has(.sliders){break-inside:avoid}
.flow .sec > h3{break-after:avoid;font-size:clamp(19px,2.4vmin,28px)}
.flow .facts,.flow .tbl,.flow .note,.flow .tile,.flow .fact,.flow .quote,.flow .extra,.flow .fig,.flow li,.flow tr,.flow .tcol{break-inside:avoid}
.flow .cols{display:block}
.flow .cols > div{margin-bottom:clamp(14px,2vmin,24px)}
.flow .quote p{font-size:clamp(20px,2.6vmin,32px)}
.flow .fig img{max-height:min(34vh,380px);width:auto;max-width:100%}
.flow .tiles{grid-template-columns:1fr}
.flow .tile{display:grid;grid-template-columns:auto 1fr;column-gap:14px;row-gap:2px;align-items:start}
.flow .tile .emo{grid-row:1 / span 2}
.flow .hero{grid-template-columns:1fr;gap:14px}
.flow .hero .vis{min-height:0}
.flow .tile .emo{width:clamp(36px,5vmin,52px);height:clamp(36px,5vmin,52px)}
.flow .three{grid-template-columns:1fr}
.flow .clock{width:clamp(120px,19vh,210px)}
.stop .vslot{height:min(40vh,480px)}
/* ---------- Mitmachen ---------- */
.rowbtn{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.revealsteps li{transition:opacity .35s ease, filter .35s ease}
.revealsteps li.hid{opacity:.12;filter:blur(3px)}
.rev{display:grid;margin-top:8px;border:none;background:none;cursor:pointer;text-align:left;font:inherit;color:inherit;padding:0}
.rev > span{grid-area:1/1;transition:opacity .3s ease}
.rev-c{display:flex;align-items:center;gap:8px;justify-content:center;font-weight:700;color:var(--cd);border:2px dashed var(--c);border-radius:12px;padding:6px 10px;background:var(--surface)}
.rev-t{opacity:0;font-size:.95em}
.rev-t::before{content:"Roth: ";font-weight:700;color:var(--cd)}
.rev.open .rev-c{opacity:0}.rev.open .rev-t{opacity:1}
.pickq{display:grid;gap:12px}
.pq{background:var(--paper);border-radius:14px;padding:10px 14px}
.pq-q{font-weight:700;margin-bottom:6px}
.pq-o{display:flex;gap:6px;flex-wrap:wrap}
.pq-o button{font:inherit;font-size:.88em;border:2px solid var(--line2);background:var(--surface);border-radius:999px;padding:3px 12px;cursor:pointer}
.pq-o button:hover{border-color:var(--cd)}
.pq-o button.ok{background:var(--hen-s);border-color:var(--hen);color:var(--hen-d);font-weight:700}
.pq-o button.bad{background:var(--skin-s);border-color:var(--skin);color:var(--skin-d)}
.pq-f{min-height:2.7em;font-size:.88em;margin-top:6px;color:var(--ink2)}
.scenes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.scenes .btn{padding:.35em .9em;font-size:.95em}
.scenebox{background:var(--cs);border-radius:16px;padding:12px 16px;display:grid;gap:8px;min-height:13.5em}
.sc-head{display:flex;align-items:center;gap:12px}
.sc-head .emo{width:2.6em;height:2.6em}
.sc-head b{display:block;font-family:var(--display);font-size:1.4em;line-height:1}
.scenebox small{display:block;font-size:.78em;color:var(--ink2)}
.sc-row{background:var(--surface);border-radius:10px;padding:6px 10px}
.sc-row.plus{border-left:5px solid var(--hen)}.sc-row.minus{border-left:5px solid var(--skin)}
.gut{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;display:grid}
.gut > .who3{grid-area:1/1}
.gut-c,.gut-t{grid-area:2/1;transition:opacity .3s ease}
.gut-c{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;color:var(--cd);border:2px dashed var(--c);border-radius:12px;margin-top:12px;align-self:center;padding:8px}
.gut-t{opacity:0;margin-top:10px;font-size:.92em;line-height:1.45}
.gut.open .gut-c{opacity:0}.gut.open .gut-t{opacity:1}
.verdictout{background:var(--paper);border-radius:14px;padding:12px 16px;margin-top:10px;min-height:5.6em;font-size:.95em}
.sliders{display:grid;gap:12px}
.sl{display:grid;grid-template-columns:8em 1fr 6.5em;align-items:center;gap:14px;background:var(--cs);border-radius:14px;padding:8px 14px}
.sl-n{display:flex;align-items:center;gap:8px}.sl-n .emo{width:1.8em;height:1.8em}
.sl input{accent-color:var(--cd);width:100%}
.sl-v{font-family:var(--display);font-size:1.3em;text-align:right;line-height:1}
.sl-v small{display:block;font-family:var(--body);font-size:.6em;color:var(--ink2)}
.whobtns{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.whob{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px;border-radius:18px;border:3px solid var(--c);background:var(--cs);cursor:pointer;font:inherit}
.whob .emo{width:clamp(48px,7vmin,80px);height:clamp(48px,7vmin,80px)}
.whob b{font-family:var(--display);font-size:1.3em;color:var(--cd)}
.whob.ok{background:var(--hen-s);border-color:var(--hen);box-shadow:0 0 0 4px var(--hen)}
.whob.bad{opacity:.55}

/* ---------- Breite Abschnitte ---------- */
.cmptop{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(18px,3vmin,44px);align-items:center}
.cmptop .lead .big{font-size:clamp(22px,3vmin,38px)}
.flow > .sec.span{column-span:all;break-inside:avoid}
.rowbtn.center{justify-content:center}
/* Roth: Schritt-Karten */
.stepgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,1.6vmin,18px)}
.stepcard{position:relative;display:grid;border-radius:18px;background:var(--surface);border:2px solid var(--line);padding:clamp(12px,1.8vmin,20px) clamp(12px,1.8vmin,20px) clamp(12px,1.8vmin,20px) clamp(46px,6vmin,64px);min-height:7.6em;transition:border-color .3s ease, background .3s ease, transform .3s ease}
.stepcard > .sc-front,.stepcard > .sc-back{grid-area:1/1;transition:opacity .35s ease}
.stepcard .sn{position:absolute;left:clamp(10px,1.4vmin,16px);top:clamp(12px,1.8vmin,20px);width:clamp(28px,3.6vmin,40px);height:clamp(28px,3.6vmin,40px);border-radius:50%;background:var(--c);color:#fff;font-family:var(--display);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:1.1em}
.sc-front{display:flex;gap:12px;align-items:flex-start}
.sc-front .emo{width:clamp(34px,4.6vmin,52px);height:clamp(34px,4.6vmin,52px)}
.sc-front b{font-family:var(--display);font-size:1.12em;display:block;margin-bottom:2px}
.sc-front p{font-size:.95em;line-height:1.4}
.sc-back{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink2);font-weight:700;opacity:0}
.stepcard.hid{background:var(--paper);border-style:dashed;border-color:var(--line2)}
.stepcard.hid .sn{background:var(--line2)}
.stepcard.hid .sc-front{opacity:0}.stepcard.hid .sc-back{opacity:1}
.stepcard.cur{border-color:var(--c);background:var(--cs);transform:translateY(-2px)}
/* Skinner: Test als Leiste */
.span .pickq{grid-template-columns:repeat(4,1fr);gap:clamp(10px,1.4vmin,16px)}
.span .pq{display:flex;flex-direction:column;background:var(--surface);border:1.5px solid var(--line);padding:12px 14px}
.span .pq-q{min-height:2.8em}
.span .pq-o{flex-direction:column;align-items:stretch}
.span .pq-o button{text-align:left;border-radius:10px}
.span .pq-f{min-height:3.6em}
/* Skinner: Simulation */
.simwrap{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.3fr) minmax(0,1fr);gap:clamp(14px,2.2vmin,28px);align-items:stretch}
.simctl{display:flex;flex-direction:column;gap:8px}
.simctl > b{font-family:var(--display);font-size:1.05em;margin-top:4px}
.planbtn{text-align:left;font:inherit;border:2px solid var(--line2);background:var(--surface);border-radius:14px;padding:8px 12px;cursor:pointer}
.planbtn b{display:block;font-family:var(--display)}
.planbtn small{color:var(--ink2);font-size:.82em}
.planbtn.on{border-color:var(--c);background:var(--cs)}
.simbox{background:var(--cs);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:10px}
.skbox{width:100%;height:auto;max-height:34vh}
.simstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.simstats span{background:var(--surface);border-radius:12px;padding:6px 10px;text-align:center}
.simstats small{display:block;font-size:.78em;color:var(--ink2)}
.simstats b{font-family:var(--display);font-size:1.5em;color:var(--cd)}
.simchart{display:flex;flex-direction:column;gap:4px}
.simchart > b{font-family:var(--display);font-size:1.05em}
.simchart > small{color:var(--ink2);font-size:.82em}
.skchart{width:100%;height:auto;background:var(--surface);border-radius:14px}
.simmsg{background:var(--paper);border-radius:12px;padding:10px 12px;font-size:.92em;min-height:4.8em}
/* Henecka: Theater-Vokabular */
.metagrid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,1.6vmin,16px)}
.meta{display:flex;gap:12px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:10px 14px}
.meta .emo{width:clamp(36px,5vmin,56px);height:clamp(36px,5vmin,56px)}
.meta b{display:block;font-family:var(--display);font-size:1.1em;color:var(--cd)}
.meta span{font-size:.92em;line-height:1.35}
/* Henecka: Sozialisation */
.lifepath{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(10px,1.6vmin,18px);position:relative}
.lifepath::before{content:"";position:absolute;left:4%;right:4%;top:calc(clamp(36px,5vmin,56px)/2 + 12px);height:4px;background:var(--c);border-radius:2px;opacity:.5}
.lp{position:relative;display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px}
.lp .emo{width:clamp(36px,5vmin,56px);height:clamp(36px,5vmin,56px);background:var(--surface);border-radius:50%}
.lp b{font-family:var(--display);font-size:1.15em}
.lp small{color:var(--cd);font-weight:700;font-size:.8em}
.lp span{font-size:.92em}
.lp i{font-size:.88em;color:var(--ink2)}
.lp.first{border-color:var(--c);background:var(--cs)}
.mmsort{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(10px,1.6vmin,16px)}
.mmcol{background:var(--cs);border-radius:16px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.mmcol b{width:100%;font-family:var(--display);color:var(--cd);margin-bottom:2px}

/* Vergleich */
.detscale{position:relative;height:clamp(120px,15vh,170px);margin:6px 2% 0}
.ds-bar{position:absolute;left:0;right:0;top:44%;height:12px;border-radius:6px;background:linear-gradient(90deg,#29507e,#7fa8d9 35%,#e6be55 55%,#86bc9a 85%,#cfe7d7)}
.ds-l,.ds-r{position:absolute;top:0;font-size:.85em;color:var(--ink2)}
.ds-l{left:0}.ds-r{right:0}
.ds-m{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;text-align:center}
.ds-m .face3{width:clamp(44px,6vmin,62px);height:clamp(44px,6vmin,62px)}
.ds-m b{font-family:var(--display);color:var(--cd);margin-top:clamp(26px,3.6vh,40px)}
.ds-m small{font-size:.78em;color:var(--ink2)}
.links3{display:grid;gap:10px}
.link3{background:var(--surface);border-radius:14px;padding:10px 14px;border:1.5px solid var(--line)}
.lk-e{display:flex;align-items:center;gap:6px;font-size:.82em;color:var(--ink2)}
.lk-e i{width:12px;height:12px;border-radius:50%;display:inline-block}
.link3 b{display:block;font-family:var(--display);font-size:1.05em;margin:2px 0}
.link3 span{font-size:.92em}
@media (max-width:820px){.stepgrid,.metagrid{grid-template-columns:1fr}.span .pickq,.lifepath,.mmsort{grid-template-columns:1fr 1fr}.simwrap{grid-template-columns:1fr}}

/* ---------- (alt) Karteikarten ---------- */
.deckarea{flex:1;position:relative;width:min(1440px,calc(100% - 2*clamp(12px,3vw,48px)));margin:clamp(12px,2.2vmin,26px) auto 0;font-size:clamp(15px,1.75vmin,21px);min-height:0}

.cin .tbl{background:var(--paper)}
.cin .fig img{max-height:min(44vh,460px);width:auto;max-width:100%;margin:0 auto}
.cin .quote p{font-size:clamp(22px,3.2vmin,40px)}
.cin .part > *:first-child{margin-top:0}
.cin.heroonly .hero{grid-template-columns:1fr;gap:clamp(16px,2.6vmin,34px)}
.cin.heroonly .vis{min-height:0;padding:clamp(18px,3vmin,40px)}
.cin.heroonly .vis svg.full{max-height:min(33vh,380px);width:100%}
.cin.heroonly .bigemo{width:clamp(130px,22vmin,260px);height:clamp(130px,22vmin,260px)}
.cin.heroonly .chain .st .emo{width:clamp(80px,13vmin,160px);height:clamp(80px,13vmin,160px)}

.deckbar{flex:none;width:min(1640px,calc(100% - 2*clamp(12px,3vw,48px)));margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:clamp(8px,1.4vmin,14px) 0 clamp(12px,2vmin,22px)}

.deckbar .btn[hidden]{visibility:hidden;display:inline-flex}
.cdots{display:flex;align-items:center;gap:10px;color:var(--ink2);font-size:clamp(13px,1.5vmin,16px)}

.cdots button.on{background:var(--c);width:30px;border-radius:999px}

.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(20px,3.4vmin,48px);align-items:center;margin-bottom:clamp(26px,4vmin,52px)}
.vis{background:var(--cs);border-radius:28px;padding:clamp(18px,3vmin,36px);min-height:clamp(240px,36vmin,420px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;position:relative;overflow:hidden}

.lead .big{font-family:var(--display);font-weight:700;font-variation-settings:'wdth' 88;font-size:clamp(24px,3.4vmin,40px);line-height:1.12;letter-spacing:-.01em;margin-bottom:14px;color:var(--ink)}

.sec{margin-top:clamp(26px,4vmin,48px)}
.sec > h3{font-family:var(--display);font-weight:750;font-variation-settings:'wdth' 88;font-size:clamp(21px,2.9vmin,32px);line-height:1.1;margin-bottom:12px;display:flex;align-items:center;gap:12px}
.sec > h3 .ic{color:var(--cd);font-size:.85em}
.sec > p{max-width:72ch}
.sec > p+p{margin-top:10px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:clamp(16px,2.4vmin,30px);align-items:start}
ul.dots{padding-left:1.2em}
ul.dots li{margin:7px 0}
ul.dots li::marker{color:var(--c)}

.note{border-left:5px solid var(--c);background:var(--surface);padding:clamp(12px,1.8vmin,20px) clamp(14px,2.2vmin,24px);border-radius:0 16px 16px 0}
.note h4{font-family:var(--display);font-weight:700;font-size:1.02em;margin-bottom:4px;color:var(--cd);display:flex;gap:8px;align-items:center}
.note.warn{border-color:var(--skin)} .note.warn h4{color:var(--skin-d)}
.note.good{border-color:var(--hen)} .note.good h4{color:var(--hen-d)}
.note.theory{border-color:var(--nav)} .note.theory h4{color:var(--nav-d)}

.quote{position:relative;margin:clamp(26px,4vmin,48px) 0;padding-left:clamp(22px,3vmin,40px)}
.quote::before{content:"";position:absolute;left:0;top:.2em;bottom:.2em;width:6px;border-radius:3px;background:var(--c)}
.quote p{font-family:var(--display);font-weight:700;font-variation-settings:'wdth' 85;font-size:clamp(24px,3.6vmin,44px);line-height:1.1;letter-spacing:-.01em;max-width:30ch}
.quote span{display:block;margin-top:8px;color:var(--ink2);font-size:.85em}

.extra{border:2px dashed var(--c);border-radius:24px;padding:clamp(14px,2.2vmin,24px) clamp(16px,2.6vmin,28px);background:color-mix(in srgb, var(--cs) 55%, transparent)}
.extra h4{font-family:var(--display);font-weight:750;font-size:1.1em;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.extra ul{padding-left:1.2em}
.extra li{margin:6px 0}

.tbl{width:100%;border-collapse:collapse;font-size:.95em;background:var(--surface);border-radius:14px;overflow:hidden}
.tbl th{font-family:var(--display);font-weight:700;text-align:left;padding:10px 12px;background:var(--cs);color:var(--cd)}
.tbl td{border-top:1px solid var(--line);padding:9px 12px;vertical-align:top}
.facts{display:grid;gap:0;background:var(--surface);border-radius:18px;padding:4px 18px}
.fact{display:grid;grid-template-columns:minmax(110px,170px) 1fr;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.fact:last-child{border-bottom:none}
.fact b{color:var(--cd);font-size:.92em}
.steps{counter-reset:s;list-style:none;padding:0}
.steps li{counter-increment:s;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;margin:12px 0}
.steps li::before{content:counter(s);width:2em;height:2em;border-radius:50%;background:var(--c);color:#fff;font-family:var(--display);font-weight:800;display:flex;align-items:center;justify-content:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:clamp(12px,2vmin,22px)}
.tile{background:var(--surface);border-radius:20px;padding:clamp(14px,2vmin,22px);display:flex;flex-direction:column;gap:8px}
.tile .emo{width:clamp(42px,6vmin,64px);height:clamp(42px,6vmin,64px)}
.tile b{font-family:var(--display);font-weight:700;font-size:1.08em}
.fig{margin:0}
.fig img{width:100%;border-radius:18px;display:block;background:#fff}
.fig figcaption{font-size:.85em;color:var(--ink2);margin-top:6px}
.fig figcaption span{display:block;font-size:.85em;opacity:.85}
.navrow{display:flex;justify-content:space-between;gap:12px;margin-top:clamp(30px,4.4vmin,56px);flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:1em;background:var(--cd);color:#fff;border:2px solid var(--cd);border-radius:14px;padding:.6em 1.2em;cursor:pointer}
.btn.ghost{background:var(--surface);color:var(--cd)}

/* Illustration-Bausteine */
.chain{display:flex;align-items:center;justify-content:center;gap:clamp(6px,1.2vmin,14px);flex-wrap:wrap}
.chain .st{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;max-width:150px}
.chain .st .emo{width:clamp(54px,8.5vmin,100px);height:clamp(54px,8.5vmin,100px)}
.chain .st small{font-size:clamp(13px,1.6vmin,17px);font-weight:700;color:var(--cd);line-height:1.2}
.chain .ar{font-family:var(--display);font-weight:800;font-size:clamp(22px,3.6vmin,40px);color:var(--cd)}
.bigemo{width:clamp(110px,19vmin,220px);height:clamp(110px,19vmin,220px)}
.vis .cap{font-size:clamp(14px,1.7vmin,18px);color:var(--cd);text-align:center;font-weight:700;max-width:36ch;line-height:1.3}

/* Libet-Uhr */
.clock{width:clamp(130px,22vh,240px);aspect-ratio:1;border-radius:50%;border:3px solid var(--ink);background:var(--surface);position:relative;margin:14px auto}
.clock .tick{position:absolute;left:50%;top:50%;width:2px;height:10px;background:var(--ink2);transform-origin:50% 0}
.clock .dot{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;border-radius:50%;background:var(--roth-d)}
.clock .mark{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;border-radius:50%;border:3px solid}

/* Quiz */
.quiz{max-width:860px;margin:0 auto}
.qmeta{display:flex;justify-content:space-between;font-size:.85em;color:var(--ink2);margin-bottom:10px}
.qdots{display:flex;gap:6px;margin-bottom:18px}
.qdots i{flex:1;height:8px;border-radius:999px;background:var(--paper2)}
.qdots i.ok{background:var(--hen)}.qdots i.bad{background:var(--skin)}.qdots i.cur{background:var(--cd)}
.qcard{background:var(--surface);border-radius:24px;padding:clamp(18px,3vmin,34px)}
.qtext{font-family:var(--display);font-weight:700;font-variation-settings:'wdth' 90;font-size:clamp(22px,3.2vmin,34px);line-height:1.2;margin-bottom:20px}
.opts{display:grid;gap:12px}
.opt{text-align:left;background:var(--paper);border:2px solid transparent;border-radius:16px;padding:.8em 1em;cursor:pointer;font-size:1em;display:flex;gap:14px;align-items:center}
.opt .k{flex:none;width:2em;height:2em;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;color:var(--cd)}
.opt:hover:not(:disabled){border-color:var(--cd)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--hen);background:var(--hen-s)}
.opt.correct .k{background:var(--hen);color:#fff}
.opt.wrong{border-color:var(--skin);background:var(--skin-s)}
.opt.wrong .k{background:var(--skin);color:#fff}
.qend{text-align:center}
.qend .big{font-family:var(--display);font-weight:800;font-size:clamp(64px,12vmin,130px);color:var(--cd);line-height:1}

/* Video */
.vwrap{max-width:1100px;margin:0 auto}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:clamp(12px,2vmin,24px)}
.tcol{background:var(--cs);border-radius:20px;padding:clamp(14px,2vmin,22px);border-top:6px solid var(--c)}
.tcol p{margin-top:10px;font-size:.95em;line-height:1.45}
.who3{display:flex;align-items:center;gap:12px}
.who3 b{display:block;font-family:var(--display);font-weight:800;font-size:1.3em;line-height:1;color:var(--cd)}
.who3 small{color:var(--ink2);font-size:.82em}
.face3{flex:none;width:clamp(44px,6vmin,64px);height:clamp(44px,6vmin,64px);border-radius:50%;overflow:hidden;border:3px solid var(--c)}
.face3 .pwrap{width:100%;height:100%}
.vslot{height:min(60vh,640px)}
.vslot .vmissing{height:100%}
.vwrap video,.vslot video{width:100%;height:100%;object-fit:contain;border-radius:20px;background:#000;display:block}
.vmissing{height:min(50vh,560px);border-radius:24px;border:3px dashed var(--c);background:var(--cs);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:var(--cd);padding:20px}
.vmissing .ic{font-size:clamp(48px,8vmin,90px)}
.vmissing b{font-family:var(--display);font-weight:800;font-size:clamp(24px,3.6vmin,40px)}
.src li{margin:8px 0}
.src a{color:var(--nav-d)}
.small{font-size:.85em;color:var(--ink2)}

.tall .ph .tagline,.tall .where,.tall .linklabel{display:none}
.pill{white-space:nowrap}
@media (max-width:640px){.phead .face,#pgFs,.phead .who{display:none}.phead h2{font-size:24px}.cdots span{display:none}.deckbar .btn .lbl{display:none}}
@media (max-width:820px){.hero{grid-template-columns:1fr}.fact{grid-template-columns:1fr;gap:2px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
/* Urteil, Fazit */
.miniscale{margin:4px 0 12px}
.ms-bar{position:relative;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--cd),var(--cs))}
.ms-bar i{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transform:translate(-50%,-50%)}
.ms-l{display:flex;justify-content:space-between;font-size:.8em;color:var(--ink2);margin-top:6px}
.fzscale{position:relative;width:100%;max-width:520px;margin:0 auto;padding:56px 10px 34px}
.fz-bar{height:14px;border-radius:7px;background:linear-gradient(90deg,#9aa6bd,#e8ecf3)}
.fz-dot{position:absolute;top:56px;width:20px;height:20px;margin-top:-3px;border-radius:50%;background:var(--c);border:3px solid #fff;transform:translateX(-50%);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.fz-dot b{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:.78em;color:var(--cd);white-space:nowrap}
.fz-we{position:absolute;top:6px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;background:#3d4966;color:#fff;border-radius:12px;padding:4px 12px;line-height:1.15}
.fz-we small{font-size:.75em;opacity:.85}
.fz-we::after{content:"";position:absolute;bottom:-8px;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:#3d4966;border-bottom:0}
.fz-l{display:flex;justify-content:space-between;font-size:.8em;color:var(--ink2);margin-top:8px}
.ga{margin-bottom:10px}.ga p{margin:0 0 4px}
.bigtxt .flow{font-size:1.22em}
.bigtxt .flow .tbl td,.bigtxt .flow .tbl th{padding-top:.55em;padding-bottom:.55em}
@media (max-width:820px){.bigtxt .flow .links3,.bigtxt .flow .three{grid-template-columns:1fr!important}}
</style>
</head>

function ic(n){ return '<span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24">'+(LUCIDE[n]||'')+'</svg></span>'; }
function emo(n, cls){ return '<span class="emo '+(cls||'')+'" aria-hidden="true"><svg viewBox="0 0 32 32">'+(EMOJI[n]||'')+'</svg></span>'; }

/* ===== Fotos (Ordner „bilder“) ===== */
const FOTOS = { roth:'bilder/roth.jpg', skinner:'bilder/skinner.jpg', henecka:'bilder/henecka.jpg' };

const PH = {
  roth:    { name:'Gerhard Roth', short:'Roth', field:'Hirnforschung', level:'Gehirn', tagline:'„Das limbische System entscheidet.“', badge:'brain', c:'#7fa8d9', cs:'#e4eef8', cd:'#29507e' },
  skinner: { name:'B. F. Skinner', short:'Skinner', field:'Psychologie', level:'Lerngeschichte', tagline:'„Belohnungen formen uns.“', badge:'rat', c:'#e6be55', cs:'#fbf2d6', cd:'#6e500e' },
  henecka: { name:'Hans Peter Henecka', short:'Henecka', field:'Soziologie', level:'Gesellschaft', tagline:'„Wir spielen Rollen.“', badge:'performing-arts', c:'#86bc9a', cs:'#e3f1e8', cd:'#28603f' }
};
function cvars(k){ const p=PH[k]; return '--c:'+p.c+';--cs:'+p.cs+';--cd:'+p.cd; }

/* ===== Bausteine für Inhalte ===== */
const hero = (vis, lead) => '<div class="hero"><div class="vis">'+vis+'</div><div class="lead">'+lead+'</div></div>';
const sec = (title, icon, html) => '<section class="sec"><h3>'+ic(icon)+title+'</h3>'+html+'</section>';
const note = (kind, title, html) => '<div class="note '+kind+'"><h4>'+title+'</h4><div>'+html+'</div></div>';
const quote = (t, by) => '<div class="quote"><p>'+t+'</p>'+(by?'<span>'+by+'</span>':'')+'</div>';
const extra = (title, items) => '<div class="extra"><h4>'+ic('sparkles')+title+'</h4><ul>'+items.map(i=>'<li>'+i+'</li>').join('')+'</ul></div>';
const tbl = (head, rows) => '<table class="tbl"><tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</table>';
const facts = rows => '<div class="facts">'+rows.map(r=>'<div class="fact"><b>'+r[0]+'</b><span>'+r[1]+'</span></div>').join('')+'</div>';
const tiles = list => '<div class="tiles">'+list.map(t=>'<div class="tile">'+emo(t[0])+'<b>'+t[1]+'</b><span>'+t[2]+'</span></div>').join('')+'</div>';
const cols = (...xs) => '<div class="cols">'+xs.map(x=>'<div>'+x+'</div>').join('')+'</div>';
function fig(file, cap, credit){ return '<figure class="fig"><img src="bilder/inhalt/'+file+'" alt="'+cap+'" onerror="this.closest(\'figure\').remove()"><figcaption>'+cap+'<span>'+credit+'</span></figcaption></figure>'; }
const chain = (steps) => '<div class="chain">'+steps.map((s,i)=>(i?'<span class="ar">'+(s[2]||'→')+'</span>':'')+'<div class="st">'+emo(s[0])+'<small>'+s[1]+'</small></div>').join('')+'</div>';

/* ===== Eigene Grafiken (SVG) ===== */
function lifeline(k, ev){
  const c = PH[k].cd, W = 600, x0 = 62, x1 = 538, y = 110, n = ev.length;
  let s = '<svg class="full" viewBox="0 0 '+W+' 220" role="img" aria-label="Lebenslauf als Zeitstrahl"><line x1="'+x0+'" y1="'+y+'" x2="'+x1+'" y2="'+y+'" stroke="'+c+'" stroke-width="4" stroke-linecap="round"/>';
  ev.forEach((e,i)=>{ const x = x0 + (x1-x0)*i/(n-1), up = i%2===0;
    s += '<circle cx="'+x+'" cy="'+y+'" r="9" fill="#fff" stroke="'+c+'" stroke-width="4"/>' +
      '<text x="'+x+'" y="'+(up?y-26:y+40)+'" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="27" fill="'+c+'">'+e[0]+'</text>' +
      e[1].split('|').map((t,j)=>'<text x="'+x+'" y="'+(up?y-82+j*21:y+68+j*21)+'" text-anchor="middle" font-family="Atkinson Hyperlegible, sans-serif" font-size="17" fill="#1f2430">'+t+'</text>').join(''); });
  return s + '</svg>';
}
function gauge(k, v){
  const c = PH[k].c, d = PH[k].cd, a = Math.PI*(1 - v/10), x = 150 + 110*Math.cos(a), y = 160 - 110*Math.sin(a);
  return '<svg class="full" viewBox="0 0 300 200" style="max-width:360px" role="img" aria-label="Einschätzung '+v+' von 10">' +
    '<path d="M40 160 A110 110 0 0 1 260 160" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round"/>' +
    '<path d="M40 160 A110 110 0 0 1 '+x.toFixed(1)+' '+y.toFixed(1)+'" fill="none" stroke="'+c+'" stroke-width="26" stroke-linecap="round"/>' +
    '<text x="150" y="150" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="58" fill="'+d+'">'+v+'/10</text>' +
    '<text x="40" y="192" text-anchor="middle" font-size="14" fill="#566070">1: kaum</text><text x="260" y="192" text-anchor="middle" font-size="14" fill="#566070">10: voll</text><text x="150" y="182" text-anchor="middle" font-size="13" fill="#566070">überzeugt uns</text></svg>';
}

/* Simulation: Wahrscheinlichkeit pro Sekunde, dass die Ratte drückt */
let SIM = null;
function simReset(){
  if(SIM && SIM.raf) cancelAnimationFrame(SIM.raf);
  const plan = (SIM && SIM.plan) || 'immer';
  SIM = {plan, t:0, n:0, f:0, rate:0.35, pts:[[0,0]], raf:null, running:false, busy:0, ratX:80, tx:80};
  const q = id=>document.getElementById(id);
  if(!q('skLine')) return;
  q('skLine').setAttribute('points','36,160'); q('simT').textContent='0 s'; q('simN').textContent='0'; q('simF').textContent='0';
  q('skSwitch').setAttribute('opacity', plan==='loesch' ? 1 : 0); q('skSwitch').setAttribute('x1', 36+276*12/30); q('skSwitch').setAttribute('x2', 36+276*12/30);
  q('skRat').setAttribute('transform','translate(80 140)');
  q('simMsg').innerHTML = plan==='loesch' ? 'Die ersten 12 Sekunden gibt es Futter, danach nicht mehr (gelbe Linie).' : 'Drück auf Start.';
}
function simStart(){
  if(!SIM) simReset(); if(SIM.running) return;
  if(SIM.t >= 30) simReset();
  SIM.running = true; let last = performance.now();
  const q = id=>document.getElementById(id);
  const tick = now=>{
    if(!q('skLine')){ SIM.running=false; return; }
    const dt = Math.min(0.05, (now-last)/1000); last = now; SIM.t += dt;
    // Ratte läuft herum oder geht zum Hebel
    if(SIM.busy > 0){ SIM.busy -= dt; SIM.tx = 300; }
    else if(Math.random() < SIM.rate*dt){ // Druck
      SIM.busy = 0.55; SIM.tx = 300; SIM.n++;
      const fed = SIM.plan==='immer' || (SIM.plan==='zufall' && Math.random() < 0.3) || (SIM.plan==='loesch' && SIM.t < 12);
      if(fed){ SIM.f++; SIM.rate = Math.min(3.2, SIM.rate + (SIM.plan==='zufall' ? 0.42 : 0.3)); feed(); }
      else { SIM.rate = SIM.plan==='zufall' ? Math.max(0.6, SIM.rate*0.995) : Math.max(0.12, SIM.rate*0.8); }
      lever();
    } else if(Math.random() < 0.8*dt){ SIM.tx = 40 + Math.random()*200; }
    SIM.ratX += (SIM.tx - SIM.ratX) * Math.min(1, dt*6);
    q('skRat').setAttribute('transform','translate('+SIM.ratX.toFixed(1)+' 140)');
    if(Math.floor(SIM.t*4) !== Math.floor((SIM.t-dt)*4)){ SIM.pts.push([SIM.t, SIM.n]); drawLine(); }
    q('simT').textContent = Math.floor(SIM.t)+' s'; q('simN').textContent = SIM.n; q('simF').textContent = SIM.f;
    if(SIM.t >= 30){ SIM.running = false; SIM.pts.push([30, SIM.n]); drawLine(); simEnd(); return; }
    SIM.raf = requestAnimationFrame(tick);
  };
  SIM.raf = requestAnimationFrame(tick);
  q('simMsg').innerHTML = 'Die Ratte lernt …';
}
function drawLine(){ const max = Math.max(40, SIM.n);
  document.getElementById('skLine').setAttribute('points', SIM.pts.map(p=>(36+276*p[0]/30).toFixed(1)+','+(160-150*p[1]/max).toFixed(1)).join(' ')); }
function lever(){ const l = document.getElementById('skLever'); l.setAttribute('transform','rotate(12 384 136)'); setTimeout(()=>l.removeAttribute('transform'), 220); }
function feed(){ const p = document.getElementById('skPellet'), lamp = document.getElementById('skLamp'), pop = document.getElementById('skPop');
  lamp.setAttribute('fill','#e6be55'); p.setAttribute('opacity',1); p.setAttribute('cy',100); pop.setAttribute('opacity',1);
  let y = 100; const fall = ()=>{ y += 6; p.setAttribute('cy', Math.min(y,188)); if(y < 188) requestAnimationFrame(fall); else setTimeout(()=>{ p.setAttribute('opacity',0); lamp.setAttribute('fill','#e8ecf3'); pop.setAttribute('opacity',0); }, 250); };
  requestAnimationFrame(fall); }
function simEnd(){ const m = document.getElementById('simMsg');
  m.innerHTML = {immer:'<b>Verstärkung:</b> Jeder Druck bringt Futter, die Ratte drückt immer öfter. Die Kurve wird steiler.',
   zufall:'<b>Unregelmäßige Verstärkung:</b> Obwohl nur manchmal Futter kommt, drückt die Ratte ständig weiter. So funktionieren Likes, Lootboxen und Spielautomaten.',
   loesch:'<b>Löschung:</b> Nach der gelben Linie gibt es kein Futter mehr. Die Ratte drückt erst noch, dann immer seltener. Die Kurve wird flach.'}[SIM.plan]; }

         ['mobile-phone','Handy statt Hausaufgaben','Ich will lernen und greife trotzdem zum Handy.'+reveal('Die Gewohnheit sitzt im Erfahrungsgedächtnis und ist schneller als jeder Vorsatz.')]]) +
  note('warn','Der Haken','Roth kann <b>jede</b> Handlung im Nachhinein erklären, egal wie sie ausfällt. Genau deshalb ist seine Theorie kaum zu widerlegen. Vorhersagen, wie wir uns entscheiden, kann er aber nicht.')},
 {t:'Einwände', h:'was gegen Roth spricht', icon:'swords', body:()=>
  hero(vsVis('stop-sign','Veto möglich','magnifying-glass-tilted-left','nur Finger getestet','+'), '<p class="big">Starke Theorie, aber angreifbar.</p><p>Gegen Roth gibt es zwei Arten von Einwänden: solche gegen seine Deutung des Libet-Experiments und solche gegen seine Theorie insgesamt.</p>') +
  cols(sec('Gegen die Deutung von Libet','timer','<ul class="dots"><li><b>Veto:</b> Das Bewusstsein kann die Handlung noch stoppen.</li><li><b>Nur Fingerbewegungen:</b> keine echten Abwägungen wie Studienwahl oder Moral. Die eigentliche Entscheidung („Ich mache mit“) fiel vorher bewusst.</li><li><b>Messproblem:</b> Den Zeitpunkt W geben die Personen selbst an, das ist ungenau.</li><li><b>Bereitschaftspotential ist nicht gleich Entscheidung:</b> Neuere Deutungen sehen darin eher eine allgemeine Aktivierung.</li></ul>'),
       sec('Gegen Roth grundsätzlich','swords','<ul class="dots"><li><b>Kategorienfehler:</b> Personen entscheiden, nicht Hirnteile. Und das limbische System speichert <i>meine</i> Erfahrungen. Wenn es entscheidet, entscheide in gewisser Weise ich.</li><li><b>Selbstwiderspruch:</b> Wäre Roths eigene Überzeugung nur limbisch festgelegt, woher käme ihr Anspruch, wahr zu sein?</li><li><b>Lernfähigkeit:</b> Roth sagt selbst, wir lernen durch Belehrung. Menschen sind also durch Gründe ansprechbar.</li></ul>')) +
  quote('Verursacht zu sein heißt noch nicht, gezwungen zu sein.','Kompatibilistische Antwort auf Roth')},
 {t:'Folgen', h:'Schuld und Strafrecht', icon:'gavel', body:()=>
  hero(chain([['judge','Gericht'],['balance-scale','Schuld?','→'],['shield','Schutz und Therapie','→']]), '<p class="big">Keine Freiheit, keine Schuld?</p><p>Schuld setzt voraus, dass man <b>anders hätte handeln können</b>. Nach Roth kann das niemand. Also gibt es keinen subjektiven Schuldbegriff: Lob, Tadel und Reue verlieren ihre Grundlage. Strafe wäre dann keine Vergeltung mehr, sondern nur noch Schutz der Gesellschaft und Besserung des Täters.</p>') +
  note('theory','Was das Gesetz sagt','<b>§ 20 StGB:</b> Ohne Schuld handelt, wer wegen einer schweren seelischen Störung unfähig ist, das Unrecht einzusehen oder nach dieser Einsicht zu handeln. <b>§ 21:</b> verminderte Schuldfähigkeit, mildere Strafe. Das Recht unterstellt bei gesunden Erwachsenen also Steuerungsfähigkeit, ohne die Freiheitsfrage philosophisch lösen zu müssen.') +
  sec('Sollte das Strafrecht die Willensfreiheit aufgeben?','scale', tbl(['Ja, aufgeben','Nein, am Schuldprinzip festhalten'],[
   ['Wenn niemand anders handeln kann, wäre ein Schuldvorwurf ungerecht.','Das Recht braucht nur „normale“ Ansprechbarkeit durch Gründe. Genau das prüft § 20.'],
   ['Besser Prävention und Resozialisierung wie im skandinavischen Modell.','Schuld <b>begrenzt</b> Strafe. Ohne sie könnte man „Gefährliche“ unbegrenzt wegsperren.'],
   ['Kindheit, Erfahrungen und Gehirn werden ernst genommen.','Strafe ist selbst eine Erfahrung, aus der man lernt. Sie wirkt also auch, wenn Roth recht hat.']])) +
  quote('Freiheit nicht abschaffen, sondern kompatibilistisch verstehen: schuldfähig ist, wer für Gründe und Regeln ansprechbar ist.','Unser Fazit')}
],
skinner: [
 {t:'Steckbrief', h:'Leben und Werk', icon:'id-card', body:()=>
  hero(lifeline('skinner',[['1904','geboren|Pennsylvania'],['1931','Doktor|in Harvard'],['1948','Walden Two|Harvard-Prof.'],['1953','Science and|Human Behavior'],['1971','Jenseits von|Freiheit und Würde'],['1990','gestorben']]),
   '<p class="big">Der bekannteste Behaviorist der Welt.</p><p>Burrhus Frederic Skinner wollte nach seinem Englisch-Studium eigentlich Schriftsteller werden. Dann stieß er auf die Lernpsychologie von John B. Watson und Iwan Pawlow und wurde einer der einflussreichsten Psychologen des 20. Jahrhunderts.</p>') +
  sec('Daten und Stationen','id-card', facts([['Lebensdaten','20. März 1904 in Susquehanna (Pennsylvania) bis 18. August 1990 in Cambridge (Massachusetts)'],['Laufbahn','Promotion 1931 in Harvard, dann University of Minnesota (ab 1936), Indiana University (1945–48), 1948–1974 Professor in Harvard'],['Erfindungen','Skinner-Box, Lehrmaschine fürs programmierte Lernen, „Air Crib“ (klimatisierter Babykasten)'],['Wichtige Bücher','<i>The Behavior of Organisms</i> (1938), <i>Walden Two</i> (1948), <i>Science and Human Behavior</i> (1953), <i>Verbal Behavior</i> (1957), <i>Jenseits von Freiheit und Würde</i> (1971)']])) +
  cols(fig('lehrmaschine.jpg','Skinners Lehrmaschine: Lernen in kleinen Schritten, jede richtige Antwort wird belohnt','Silly rabbit, CC BY 3.0, Wikimedia Commons'),
       extra('Wusstest du?',['Skinner brachte Tauben bei, Tischtennis zu spielen.','Im Zweiten Weltkrieg arbeitete er an einer Rakete, die von Tauben gesteuert werden sollte („Project Pigeon“).','1968 bekam er die National Medal of Science. In einer Umfrage von 2002 landete er als einflussreichster Psychologe des 20. Jahrhunderts auf Platz 1.']))},
 {t:'These', h:'Verhalten ist erlernt', icon:'lightbulb', body:()=>
  hero(loopVis(), '<p class="big">Nicht du entscheidest, deine Belohnungen tun es.</p><p>Skinner erklärt Verhalten komplett <b>von außen</b>. Was „innen“ passiert, also Wille, Absicht oder Entscheidung, braucht man dafür nicht. Entscheidend ist nur, <b>was nach einem Verhalten passiert</b>. Das nennt er operante Konditionierung.</p>') +
  cols(sec('Warum fühlen wir uns frei?','circle-help','<p>Weil wir die <b>äußeren Ursachen</b> unseres Verhaltens nicht sehen. Wir merken nicht, welche Belohnungen uns über Jahre geformt haben. Das Gefühl, frei zu wollen, ist deshalb eine Täuschung.</p>'),
       sec('Was ist ein Behaviorist?','book-open','<p>Behavioristen untersuchen nur beobachtbares Verhalten, nicht Gedanken oder Gefühle. Skinners „radikaler Behaviorismus“ geht noch weiter: Auch Denken ist für ihn nur Verhalten, das durch Konsequenzen gelernt wurde.</p>')) +
  quote('Verhalten ist vollständig Produkt der Lerngeschichte.','Skinners Kernthese')},
 {t:'Argument', h:'Verstärkung, Bestrafung, Löschung', icon:'book-open', body:()=>
  hero(barsVis(), '<p class="big">Drei Begriffe erklären fast alles.</p><p>Je nachdem, was auf ein Verhalten folgt, wird es häufiger, seltener oder verschwindet ganz. Mit diesen Mechanismen will Skinner jedes Verhalten erklären, bei der Ratte wie beim Menschen.</p>') +
  sec('Die Begriffe im Überblick','book-open', tbl(['Begriff','Was passiert?','Wirkung'],[
   ['<b>Positive Verstärkung</b>','Etwas Angenehmes kommt dazu','häufiger'],
   ['<b>Negative Verstärkung</b>','Etwas Unangenehmes fällt weg','häufiger'],
   ['<b>Bestrafung</b>','Unangenehme Folge','seltener'],
   ['<b>Löschung</b>','Erwartete Belohnung bleibt dauerhaft aus','verschwindet']])) +
  note('warn','Achtung, Falle','<b>Negative Verstärkung</b> ist keine Strafe! Es fällt nur etwas Unangenehmes weg, und das Verhalten wird trotzdem häufiger.') +
  spanSec('Teste dich: Welcher Begriff passt?','circle-help', pickq('sk', ['positive Verstärkung','negative Verstärkung','Bestrafung','Löschung'], [
   ['Lob für ein gutes Referat', 0, 'Etwas Angenehmes kommt dazu, das Verhalten wird häufiger.'],
   ['Gute Noten, also kein Ärger zu Hause', 1, 'Etwas Unangenehmes fällt weg. Das ist keine Strafe, sondern Verstärkung.'],
   ['Nachsitzen fürs Zuspätkommen', 2, 'Eine unangenehme Folge, das Verhalten soll seltener werden.'],
   ['Keine Likes mehr, man postet immer weniger', 3, 'Die erwartete Belohnung bleibt aus, das Verhalten verschwindet.']]))},
 {t:'Skinner-Box', h:'Simulation zum Ausprobieren', icon:'box', body:()=>
  hero(chain([['rat','hungrige Ratte'],['gear','drückt Hebel'],['cheese-wedge','Futter!'],['rat','drückt gezielt','↻']]), '<p class="big">Lernen ohne Einsicht.</p><p>In einem Käfig mit Hebel und Futterspender drückt eine hungrige Ratte zufällig den Hebel und bekommt Futter. Danach drückt sie immer öfter. Nicht weil sie sich entschieden hat, sondern weil das Futter ihr Verhalten verstärkt. Probier es unten selbst aus: Wähl einen Verstärkungsplan und starte die Simulation.</p>') +
  '<section class="sec span"><div class="simwrap">' +
   '<div class="simctl"><b>1. Verstärkungsplan wählen</b>' +
     '<button class="planbtn on" data-act="simplan" data-p="immer"><b>Immer Futter</b><small>jeder Druck wird belohnt</small></button>' +
     '<button class="planbtn" data-act="simplan" data-p="zufall"><b>Unregelmäßig</b><small>nur manchmal Futter, wie bei Likes</small></button>' +
     '<button class="planbtn" data-act="simplan" data-p="loesch"><b>Löschung</b><small>erst Futter, dann gar keins mehr</small></button>' +
     '<b>2. Starten</b><div class="rowbtn"><button class="btn" data-act="simstart">'+ic('play')+'Start</button><button class="btn ghost" data-act="simreset">'+ic('rotate-ccw')+'Neu</button></div></div>' +
   '<div class="simbox">'+skinnerBoxSVG()+'<div class="simstats"><span><small>Zeit</small><b id="simT">0 s</b></span><span><small>Hebeldrücke</small><b id="simN">0</b></span><span><small>Futter</small><b id="simF">0</b></span></div></div>' +
   '<div class="simchart"><b>Kumulative Aufzeichnung</b><small>So hat Skinner selbst gemessen: Je steiler die Linie, desto öfter wird gedrückt.</small>'+simChartSVG()+'<div class="simmsg" id="simMsg">Wähl einen Plan und drück auf Start.</div></div>' +
  '</div></section>'},
 {t:'Alltag', h:'Likes, Streaks, Noten', icon:'smartphone', body:()=>
  hero(chain([['mobile-phone','Foto posten'],['thumbs-up','viele Likes'],['chart-increasing','öfter posten']]), '<p class="big">Die Skinner-Box in deiner Hosentasche.</p><p>Skinners Modell ist im digitalen Alltag präsenter, als es auf den ersten Blick scheint. Apps, Schulen und Werbung arbeiten ständig mit Verstärkung, oft ohne dass wir es merken.</p>') +
  tiles([['mobile-phone','Instagram','Foto posten, viele Likes, öfter posten. Gegenprobe: kaum Likes, nach und nach weniger posten. Das ist Löschung.'],
         ['high-voltage','Snapchat-Streak','Täglich schreiben, damit die Zahl wächst. Reißt die Streak ab, ist die Belohnung weg, daher der Druck dranzubleiben.'],
         ['graduation-cap','Schule','Regelmäßig lernen bringt gute Noten und Lob (positiv) und erspart Ärger zu Hause (negativ). Beides verstärkt.'],
         ['key','Konsum','Für den Gratisversand ab 50 € noch etwas dazukaufen, Punkte in der Kundenkarte sammeln: Belohnung mit Plan.']]) +
  note('theory','Warum das so gut funktioniert','Bei Likes, Streaks und Punkten wird nicht jedes Mal gleich belohnt, sondern unregelmäßig. Genau dieser Verstärkungsplan macht Verhalten am hartnäckigsten.')},
 {t:'Einwände', h:'Mensch oder Ratte?', icon:'swords', body:()=>
  hero(vsVis('student','Mensch','rat','Ratte','≠?'), '<p class="big">Ist ein Mensch eine Ratte mit Handy?</p><p>Im Unterricht haben wir zwei Thesen gegeneinander gestellt: Ist Verstärkungslernen mit Freiheit vereinbar, oder widerlegt es sie? Die Begriffe Kompatibilismus und Inkompatibilismus aus Modul 3.1 helfen beim Sortieren.</p>') +
  cols(sec('These A: vereinbar','check','<ul class="dots"><li>Gründe aus meiner Lerngeschichte sind trotzdem <i>meine</i>.</li><li>Verstärkung ist ein Anreiz, kein Zwang.</li><li>Wer Verstärkung durchschaut, kann sie nutzen oder ablehnen, zum Beispiel bewusst auf Likes verzichten.</li><li>Der Linguist Noam Chomsky kritisierte 1959, dass sich Sprache nicht mit Reiz und Reaktion erklären lässt.</li></ul>'),
       sec('These B: widerlegt Freiheit','x','<ul class="dots"><li>Gleiche Lerngeschichte plus gleiche Lage ergibt immer dasselbe Verhalten.</li><li>Bei Likes oder Werbung merken wir oft gar nicht, dass wir gesteuert werden.</li><li>Auch Selbstkontrolle ist laut Skinner gelernt und damit verstärkt.</li></ul>')) +
  quote('Verursacht sein ist nicht dasselbe wie gezwungen werden.','Wie man These B entkräften kann')},
 {t:'Folgen', h:'Freiheit und Würde', icon:'globe', body:()=>
  hero(vsVis('house-with-garden','Utopie','video-camera','Dystopie','oder'), '<p class="big">Wenn wir sowieso geformt werden, warum dann nicht gezielt?</p><p>In <i>Jenseits von Freiheit und Würde</i> (1971) zieht Skinner eine radikale Folgerung: Verhalten soll man bewusst und wissenschaftlich formen, in Erziehung, Schule und Gesellschaft, statt es dem Zufall zu überlassen. „Freiheit“ und „Würde“ sind für ihn <b>nützliche Fiktionen</b>, die dabei im Weg stehen.</p>') +
  cols(sec('Was dafür spricht','sprout','<ul class="dots"><li>weniger Zufall und Willkür in Erziehung und Schule</li><li>Belohnen statt Strafen ist humaner und wirkt besser</li><li>Verstärkung passiert durch Apps sowieso. Lieber offen und im Sinne aller.</li></ul>'),
       sec('Was dagegen spricht','shield-alert','<ul class="dots"><li>Wer kontrolliert die Kontrolleure?</li><li>Der Mensch wird zum Objekt, seine Würde verschwindet.</li><li>Gefahr von Manipulation und Überwachung, etwa durch Bewertungssysteme wie in <i>Black Mirror</i>, Folge „Nosedive“.</li></ul>')) +
  extra('Zum Weiterdenken',['Skinners Roman <i>Walden Two</i> (1948) beschreibt eine Gemeinschaft, die nach seinen Prinzipien geplant ist. Er meinte das als Utopie.','Aldous Huxleys <i>Schöne neue Welt</i> und <i>Uhrwerk Orange</i> zeigen die dunkle Seite durchkonditionierter Menschen.'])}
],
henecka: [
 {t:'Steckbrief', h:'Leben und Werk', icon:'id-card', body:()=>
  hero(lifeline('henecka',[['1941','geboren|in Karlsruhe'],['1969','Promotion|Heidelberg'],['1973','Professor|PH Heidelberg'],['1985','Grundkurs|Soziologie'],['2007','emeritiert']]),
   '<p class="big">Der Soziologe, der die Gesellschaft als Bühne beschreibt.</p><p>Hans Peter Henecka wuchs in Bruchsal auf und studierte Soziologie, Sozialpsychologie, Politikwissenschaft und Völkerrecht in Heidelberg, Köln und Berlin. Über 30 Jahre lang brachte er angehenden Lehrkräften an der Pädagogischen Hochschule Heidelberg Soziologie bei.</p>') +
  sec('Daten und Stationen','id-card', facts([['Lebensdaten','geboren am 3. April 1941 in Karlsruhe'],['Promotion','1969 in Heidelberg, mit einer Arbeit über den Konflikt der jurassischen Separatisten in der Schweiz'],['Beruf','1973–2007 Professor für Soziologie an der Pädagogischen Hochschule Heidelberg, dort u. a. Dekan und Prorektor; zusätzlich Lehrauftrag für Bildungssoziologie an der Universität Heidelberg'],['Hauptwerk','<i>Grundkurs Soziologie</i> (UTB), erstmals 1985, inzwischen in über zehn Auflagen. Daraus stammt unser Text „Auf der Bühne der Gesellschaft“.']])) +
  cols(fig('masken-mosaik.jpg','Masken für Tragödie und Komödie: römisches Mosaik aus dem 2. Jahrhundert, Kapitolinische Museen Rom','Foto: antmoose, CC BY 2.0, Wikimedia Commons'),
       extra('Wusstest du?',['Gastprofessuren führten ihn nach St. Petersburg (1992) und Luzern (2006–2009).','Das Bild vom Leben als Theater ist alt: Bei Shakespeare heißt es „Die ganze Welt ist Bühne“.','Henecka steht in der Tradition der Rollentheorie, die der Soziologe Ralf Dahrendorf mit dem „Homo Sociologicus“ bekannt gemacht hat.']))},
 {t:'These', h:'Bühne der Gesellschaft', icon:'drama', body:()=>
  hero(stageVis(), '<p class="big">Wir sind Rollenspieler auf der Bühne der Gesellschaft.</p><p>Mit der Geburt betreten wir die Bühne und lernen nach und nach unsere Rollen. Je nach Szene tragen wir eine andere <b>Maske</b>: liebevoll als Partner, knallhart im Beruf. Mitspieler und Publikum kennen den „sozialen Text“ genau und erwarten, dass wir ihn spielen.</p>') +

   ['scroll','Sozialer Text','die Rollennormen, also was von uns erwartet wird'],
   ['busts-in-silhouette','Publikum','die anderen, die zuschauen und mit Lob oder Tadel reagieren'],

 {t:'Argument', h:'Positionen, Normen, Sanktionen', icon:'layers', body:()=>
  hero(vsVis('thumbs-up','positive Sanktion','thumbs-down','negative Sanktion','oder'), '<p class="big">Die Rolle gibt es schon, bevor wir kommen.</p><p>Die Gesellschaft ist ein Gefüge aus <b>Positionen</b>, die unabhängig von der Person bestehen. An jede Position sind <b>Rollennormen</b> geknüpft, also Verhaltenserwartungen. Wer sie erfüllt, bekommt Anerkennung. Wer abweicht, erntet Vorwürfe oder Missbilligung.</p>') +
  sec('Zugewiesen oder erworben','layers', facts([['Zugewiesen','ohne eigenes Zutun: Geschlecht, Alter, Stellung in der Familie, Nationalität (zum Beispiel Sohn)'],['Erworben','durch eigenes Handeln: Beruf, Partnerschaft, Gruppen (zum Beispiel Orga-Team der Abifeier)']])) +
  note('good','Unsere Beobachtung','Die meisten unserer Rollen sind <b>erworben</b>. Rollen sind also nicht nur Zwang, sondern auch Ergebnis eigener Entscheidungen.') +
  sec('Probier die Bühne aus: Welche Szene?','drama', '<div class="scenes">'+SCENES.map((x,i)=>'<button class="btn '+(i?'ghost':'')+'" data-act="scene" data-i="'+i+'">'+x.n+'</button>').join('')+'</div><div class="scenebox" id="scenebox">'+sceneHTML(0)+'</div>') +
  note('', 'Verbindung zu Skinner','Sanktionen funktionieren wie Verstärkung und Bestrafung, nur eben durch die Gesellschaft statt durch Futter.')},
 {t:'Sozialisation', h:'wie wir Rollen lernen', icon:'sprout', body:()=>
  hero(circlesVis(), '<p class="big">Wir wachsen in unsere Rollen hinein.</p><p><b>Sozialisation</b> ist der lebenslange Prozess, in dem ein Mensch in die Gesellschaft hineinwächst. Er lernt Werte, Normen und Rollen seiner Umgebung kennen, übernimmt sie und wird so zu einem handlungsfähigen Mitglied der Gesellschaft.</p>') +

   ['busts-in-silhouette','Freunde und Medien','sekundär','Gruppendruck, Vorbilder, Influencer','„Das trägt man jetzt so.“'],

   ['henecka','Henecka: Gesellschaft',['Familie und Erziehung','Peergroup','Schule','Gesetze und Normen']],

 {t:'Alltag', h:'Rollenkonflikte', icon:'split', body:()=>
  hero(chain([['handshake','Orga-Team'],['speech-balloon','widersprüchliche Erwartungen','⇄'],['thought-balloon','ich muss abwägen','→']]), '<p class="big">Wenn sich Rollen widersprechen, muss ich selbst entscheiden.</p><p>Rollen geben Erwartungen vor. Aber was passiert, wenn diese Erwartungen nicht zusammenpassen? Henecka unterscheidet zwei Arten von Rollenkonflikten.</p>') +

 {t:'Einwände', h:'Spielraum und Folgen', icon:'move', body:()=>

function runSort(){
  const box = document.getElementById('sortBox'), qs = shuffle(SAGT); let i = 0, score = 0;
  const step = ()=>{
    if(i >= qs.length){ box.innerHTML = '<div class="qcard qend"><div class="big">'+score+'/'+qs.length+'</div><p class="qtext" style="margin:12px 0 0">'+(score>=10?'Du kennst alle drei richtig gut!':score>=7?'Solide, ein paar Verwechsler waren dabei.':'Die drei klingen ähnlich. Schau dir die Thesen noch mal an.')+'</p><div class="rowbtn" style="justify-content:center;margin-top:20px"><button class="btn" id="sAgain">'+ic('rotate-ccw')+'Noch eine Runde</button></div></div>'; box.querySelector('#sAgain').addEventListener('click', runSort); return; }
    const q = qs[i];
    box.innerHTML = '<div class="qmeta"><span>Aussage '+(i+1)+' von '+qs.length+'</span><span>'+score+' richtig</span></div><div class="qcard"><p class="qtext">„'+q[0]+'“</p><div class="whobtns">'+Object.keys(PH).map(k=>'<button class="whob" data-k="'+k+'" style="'+cvars(k)+'">'+emo(PH[k].badge)+'<b>'+PH[k].short+'</b></button>').join('')+'</div><div id="sNext"></div></div>';
    box.querySelectorAll('.whob').forEach(b=>b.addEventListener('click',()=>{
      if(box.querySelector('.whob.ok')) return;
      const ok = b.dataset.k === q[1]; if(ok) score++;
      box.querySelectorAll('.whob').forEach(x=>{ if(x.dataset.k===q[1]) x.classList.add('ok'); else if(x===b) x.classList.add('bad'); });
      box.querySelector('#sNext').innerHTML = '<div style="margin-top:16px">'+note(ok?'good':'warn', ok?'Richtig':'Knapp daneben', 'Das sagt <b>'+PH[q[1]].name+'</b>.')+'</div><div style="text-align:right;margin-top:14px"><button class="btn" id="sGo">'+(i+1<qs.length?'Nächste Aussage':'Ergebnis ansehen')+ic('chevron-right')+'</button></div>';
      box.querySelector('#sGo').addEventListener('click',()=>{ i++; step(); });
    }));
  };
  step();
}

function relRect(el){ const r = el.getBoundingClientRect(), s = vp.getBoundingClientRect(); return {left:r.left-s.left, top:r.top-s.top, width:r.width, height:r.height}; }
function px(r){ return {left:r.left+'px', top:r.top+'px', width:r.width+'px', height:r.height+'px'}; }
function makeFlyer(k, r){ const f = document.createElement('div'); f.className='flyer'; f.style.borderColor=PH[k].c; f.innerHTML=portrait(k); Object.assign(f.style, px(r)); vp.appendChild(f); return f; }
function fly(f, from, to, done){ if(REDUCE){ done(); return; } const a = f.animate([px(from), px(to)], {duration:820, easing:'cubic-bezier(.65,0,.35,1)', fill:'forwards'}); a.onfinish = done; }
function tweenLines(stage, toCenter, dur){
  const ls = [...stage.querySelectorAll('line[data-x]')], start = ls.map(l=>[+l.getAttribute('x2'), +l.getAttribute('y2')]), t0 = performance.now();
  const step = now=>{ let t = Math.min(1,(now-t0)/dur); t = 1-Math.pow(1-t,3);
    ls.forEach((l,i)=>{ const tx = toCenter? +stage.dataset.cx : +l.dataset.x, ty = toCenter? +stage.dataset.cy : +l.dataset.y;
      l.setAttribute('x2', start[i][0]+(tx-start[i][0])*t); l.setAttribute('y2', start[i][1]+(ty-start[i][1])*t); });
    if(t<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function expandNodes(stage){ stage.querySelectorAll('.node').forEach((n,i)=>setTimeout(()=>{ n.style.left=n.dataset.x+'%'; n.style.top=n.dataset.y+'%'; n.style.opacity=1; }, REDUCE?0:i*55)); tweenLines(stage, false, REDUCE?1:650); }
function collapseNodes(stage){ stage.querySelectorAll('.node').forEach(n=>{ n.style.left=stage.dataset.cx+'%'; n.style.top=stage.dataset.cy+'%'; n.style.opacity=0; }); tweenLines(stage, true, REDUCE?1:380); }

/* Fäden vom Spielkreuz zu den Porträts, aus den echten Positionen berechnet */
function drawThreads(st){
  const svg = st.querySelector('svg.threads'); if(!svg) return;
  const S = st.getBoundingClientRect(), W = S.width, H = S.height;
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  const pt = el=>{ const r = el.getBoundingClientRect(); return [r.left-S.left+r.width/2, r.top-S.top+r.height/2, r]; };
  const btn = st.querySelector('#cmpBtn').getBoundingClientRect();
  const starts = { roth:pt(st.querySelector('[data-knob="roth"]')), skinner:pt(st.querySelector('[data-knob="skinner"]')), henecka:[btn.left-S.left+btn.width/2, btn.bottom-S.top+2] };
  let out = '';
  Object.keys(PH).forEach(k=>{
    const s = starts[k]; let ex, ey;
    if(isTall() && k!=='henecka'){ const r = st.querySelector('[data-ph="'+k+'"] .field').getBoundingClientRect(); ex = r.left-S.left+r.width/2; ey = r.bottom-S.top+10; }
    else { const [cx, cy, r] = pt(st.querySelector('[data-ph="'+k+'"] .portrait')), R = r.width/2 + 12, dx = s[0]-cx, dy = s[1]-cy, d = Math.hypot(dx,dy) || 1; ex = cx + dx/d*R; ey = cy + dy/d*R; }
    const mx = k==='henecka' ? (s[0]+ex)/2 : ex, my = k==='henecka' ? (s[1]+ey)/2 : s[1];
    out += '<path d="M'+s[0].toFixed(1)+' '+s[1].toFixed(1)+' Q'+mx.toFixed(1)+' '+my.toFixed(1)+' '+ex.toFixed(1)+' '+ey.toFixed(1)+'" fill="none" stroke="'+PH[k].c+'" stroke-width="3" stroke-linecap="round"/>' +
           '<circle cx="'+ex.toFixed(1)+'" cy="'+ey.toFixed(1)+'" r="5" fill="'+PH[k].c+'"/>';
    if(k==='henecka') out += '<circle cx="'+s[0].toFixed(1)+'" cy="'+s[1].toFixed(1)+'" r="6" fill="'+PH[k].c+'"/>';
  });
  svg.innerHTML = out;
}
function buildDetail(k){

  const pos = list.map((_,i)=>{ if(tall) return [i%2?74:26, 47+Math.floor(i/2)*12]; const a = -Math.PI/2 + i/list.length*Math.PI*2; return [50+37*Math.cos(a), 47+35*Math.sin(a)]; });
  const st = document.createElement('div'); st.className='stage'; st.dataset.cx=C[0]; st.dataset.cy=C[1];

  list.forEach((n,i)=>{ html += '<button class="node" data-i="'+i+'" data-x="'+pos[i][0]+'" data-y="'+pos[i][1]+'" style="left:'+C[0]+'%;top:'+C[1]+'%;'+cvars(k)+'"><span class="n">'+ic(n.icon)+'</span><span><span class="t">'+n.t+'</span><span class="h">'+n.h+'</span></span></button>'; });

const BGFX = document.getElementById('bgfx');
const THEME = { none:'#e1f3ea', roth:'#dce9f7', skinner:'#f7edc9', henecka:'#d6ecdf' };
function setTheme(k){
  const cs = BGFX.querySelectorAll('.bc');
  cs.forEach(c=>{ c.classList.remove('on'); c.style.transform=''; c.style.transformOrigin=''; });
  if(!k){ delete BGFX.dataset.k; return; }
  BGFX.dataset.k = k;
  const c = BGFX.querySelector('.bc-'+k); c.classList.add('on');
  const W = innerWidth, H = innerHeight, r = c.getBoundingClientRect();
  const sc = Math.max(H*1.1, W*.5) / r.width;
  const tx = W*.5 - (r.left + r.width/2), ty = H*(innerWidth/innerHeight > 1 ? .47 : .21) - (r.top + r.height/2);
  c.style.transformOrigin = '50% 50%';
  c.style.transform = 'translate(-50%,-50%) translate('+tx+'px,'+ty+'px) scale('+sc+')';
}
function setPaper(k){ document.documentElement.style.setProperty('--paper', THEME[k||'none']); }
function pivotBg(from){
  const ox = from.left + from.width/2, oy = from.top + from.height/2;
  BGFX.querySelectorAll('.bc').forEach(c=>{ const r = c.getBoundingClientRect(); c.style.transformOrigin = (ox - r.left)+'px '+(oy - r.top)+'px'; });
}
function zoomInto(k, el){
  if(busy) return; busy = true; current = k;
  const pv = relRect(el.querySelector('.portrait')); pivotBg(pv); const _o = [...BGFX.querySelectorAll('.bc')].map(c=>c.style.transformOrigin); setTheme(k); BGFX.querySelectorAll('.bc').forEach((c,i)=>{ if(!c.classList.contains('on')) c.style.transformOrigin = _o[i]; });
  const ov = vp.querySelector('.stage'), pr = el.querySelector('.portrait'), from = relRect(pr), fl = makeFlyer(k, from);
  pr.style.visibility='hidden'; el.querySelector('.badge').style.opacity=0;
  ov.style.transformOrigin = (from.left+from.width/2)+'px '+(from.top+from.height/2)+'px'; ov.classList.add('fadeaway');
  const dt = buildDetail(k), hp = dt.querySelector('.hubph .portrait'); hp.style.visibility='hidden'; vp.appendChild(dt); barsDetail(k);
  fly(fl, from, relRect(hp), ()=>{ hp.style.visibility=''; hp.classList.add('land'); fl.remove(); ov.remove(); dt.classList.add('ready'); expandNodes(dt); setTimeout(()=>{busy=false;},500); });
}
function zoomBack(){
  if(busy) return; busy = true; setTheme(null);
  const k = current, dt = vp.querySelector('.stage'); dt.classList.remove('ready'); collapseNodes(dt);
  setTimeout(()=>{
    const hp = dt.querySelector('.hubph .portrait'), from = relRect(hp), fl = makeFlyer(k, from); hp.style.visibility='hidden';
    const ov = buildOverview(); vp.insertBefore(ov, dt); drawThreads(ov);
    const tEl = ov.querySelector('[data-ph="'+k+'"]'), target = tEl.querySelector('.portrait'), to = relRect(target);
    target.style.visibility='hidden'; tEl.querySelector('.badge').style.opacity=0;
    ov.style.transformOrigin = (to.left+to.width/2)+'px '+(to.top+to.height/2)+'px';
    ov.classList.add('start'); void ov.offsetWidth; ov.classList.remove('start'); ov.classList.add('arrive');
    dt.style.transition='opacity .3s ease'; dt.style.opacity=0; barsOverview();
    fly(fl, from, to, ()=>{ target.style.visibility=''; tEl.querySelector('.badge').style.opacity=''; fl.remove(); dt.remove(); ov.classList.remove('arrive'); current=null; busy=false; });
  }, REDUCE?0:400);
}
