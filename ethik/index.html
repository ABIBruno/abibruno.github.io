function openPage(st, ev){
  enterFS(); stopLibet(); pageState = st;
  const k = st.k, p = k ? PH[k] : null; setPaper(k);
  page.setAttribute('style', k ? cvars(k) : '--c:#7c8aa8;--cs:#e8ecf3;--cd:#3d4966');
  page.classList.toggle('bigtxt', ['compare','compare2','compare3','ao'].includes(st.kind));
  page.style.transformOrigin = (ev && ev.clientX) ? ev.clientX+'px '+ev.clientY+'px' : '50% 50%';
  let title, who, body, back = k ? 'Zurück zu '+p.short : 'Zurück zur Übersicht';
  if(st.kind==='node'){ const n = NODES[k][st.i]; title = n.t; who = p.name+', Baustein '+(st.i+1)+' von '+NODES[k].length; body = n.body(); }
  if(st.kind==='sort'){ title = 'Wer sagt das?'; who = '12 Aussagen, drei Philosophen'; body = '<div class="quiz" id="sortBox"></div>'; }
  if(st.kind==='quiz'){ title = 'Quiz zu '+p.short; who = p.name+', 8 Fragen'; body = '<div class="quiz" id="quizBox"></div>'; }
  if(st.kind==='video'){ title = 'Fall Jonas K.: Wer ist schuld?'; who = 'Fallbeispiel-Video, alle drei Theorien'; body = videoBody(); }
  if(st.kind==='compare'){ title = 'Wer entscheidet in uns?'; who = 'Vergleich, Teil 1 von 3: die Positionen'; body = COMPARE(); }
  if(st.kind==='compare2'){ title = 'Gemeinsamkeiten und Unterschiede'; who = 'Vergleich, Teil 2 von 3'; body = COMPARE2(); }
  if(st.kind==='compare3'){ title = 'Ständig aufs Handy schauen'; who = 'Vergleich, Teil 3 von 3: ein Beispiel'; body = COMPARE3(); }
  if(st.kind==='ao'){ title = 'Alle drei auf einen Blick'; who = 'Unser Advance Organizer zu Roth, Skinner und Henecka'; body = AO(); }
  if(st.kind==='fazit'){ title = 'Wie frei ist der Mensch?'; who = 'Unser Gruppenfazit'; body = FAZIT(); }
  if(st.kind==='sources'){ title = 'Quellen'; who = 'Inhalte, Bilder und Icons'; body = SOURCES(); }
  page.innerHTML = '<div class="phead"><button class="pill strong" id="pgBack">'+ic('arrow-left')+back+'</button>' + (k ? '<span class="face">'+portrait(k)+'</span>' : '') +
    '<div><div class="who">'+who+'</div><h2>'+title+'</h2></div><span class="spacer"></span><button class="pill" id="pgFs">'+fsLabel()+'</button></div>' +
    ((st.kind==='quiz'||st.kind==='sort') ? '<div class="pbody">'+body+'</div>' : '<div class="sheet" id="sheet"></div><div class="deckbar" id="deckbar"></div>');
  requestAnimationFrame(()=>page.classList.add('show'));
  document.getElementById('pgBack').addEventListener('click', closePage);
  document.getElementById('pgFs').addEventListener('click', ()=>{ if(isFS()) document.exitFullscreen(); else enterFS(); });
  page.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>openPage({kind:'node', k, i:+b.dataset.nav})));
  page.querySelectorAll('[data-goto]').forEach(b=>b.addEventListener('click',()=>openPage({kind:b.dataset.goto, k})));
  boxState = {plan:'immer', n:0, food:0};
  if(st.kind==='quiz') runQuiz(k);
  else if(st.kind==='sort') runSort();
  else { sheetHTML = body; renderNav(); requestAnimationFrame(()=>requestAnimationFrame(()=>buildSheet())); }
}

/* ===== Inhaltsseite: alles auf einen Bildschirm (oben Bild + Einleitung, darunter Spalten) ===== */
let sheetHTML = '', sheetToken = 0, deckState = null;
function waitImgs(root){ return Promise.all([...root.querySelectorAll('img')].map(im=>im.complete ? 0 : new Promise(r=>{ im.addEventListener('load',r); im.addEventListener('error',r); setTimeout(r,2500); }))); }
async function buildSheet(){
  const sheet = document.getElementById('sheet'); if(!sheet) return;
  const token = ++sheetToken; stopLibet();
  sheet.innerHTML = '<div class="sin"><div class="stop"></div><div class="flow"></div></div>';
  const sin = sheet.querySelector('.sin'), top = sin.querySelector('.stop'), flow = sin.querySelector('.flow');
  const tmp = document.createElement('div'); tmp.innerHTML = sheetHTML;
  const blocks = [...tmp.children];
  if(blocks[0] && (blocks[0].classList.contains('hero') || blocks[0].classList.contains('solo'))) top.appendChild(blocks.shift());
  blocks.forEach(b=>flow.appendChild(b));
  if(document.fonts && document.fonts.ready) await document.fonts.ready;
  await waitImgs(sin); if(token !== sheetToken) return;
  sin.querySelectorAll('.cols').forEach(c=>{ [...c.children].forEach(x=>{ if(!x.textContent.trim() && !x.querySelector('img,svg,video')) x.remove(); }); });
  fitSheet();
  deckState = {n:1, i:0};
  if(sheet.querySelector('#libetClock')) startLibet();
  if(sheet.querySelector('#skLine')){ SIM = null; simReset(); }
}
function fitSheet(){
  const sheet = document.getElementById('sheet'); if(!sheet) return;
  const sin = sheet.querySelector('.sin'), flow = sheet.querySelector('.flow'); if(!sin) return;
  const W = window.innerWidth, narrow = W < 820;
  sheet.classList.toggle('narrow', narrow);
  sin.style.zoom = 1;
  if(narrow){ flow.style.columnCount = 1; return; }
  const wideTable = [...flow.querySelectorAll('.tbl tr:first-child')].some(r=>r.children.length >= 4);
  const n = flow.textContent.length;
  let cols = W >= 1400 ? 3 : 2; if(wideTable || n < 900) cols = Math.min(cols, 2);
  flow.style.columnCount = cols;
  const over = ()=> flow.scrollWidth > flow.clientWidth + 2 || flow.scrollHeight > flow.clientHeight + 2 || sin.scrollHeight > sin.clientHeight + 2;
  let z = 1;
  // erst etwas größer, wenn viel Platz frei ist
  const fill = ()=>{ const k = [...flow.children]; if(!k.length) return 1; let maxB = 0; k.forEach(x=>{ const r = x.getBoundingClientRect(); maxB = Math.max(maxB, r.bottom); }); const f = flow.getBoundingClientRect(); return (maxB - f.top) / f.height; };
  while(z < 1.25 && !over() && fill() < 0.7){ z += 0.03; sin.style.zoom = z; }
  if(over()) while(over() && z > 0.5){ z -= 0.02; sin.style.zoom = z; }
}
function renderNav(){
  const bar = document.getElementById('deckbar'), st = pageState; if(!bar || !st) return;
  const k = st.k; let prev = null, next = null;
  if(st.kind==='node' && st.i > 0) prev = {lbl:NODES[k][st.i-1].t, act:()=>openPage({kind:'node', k, i:st.i-1})};
  if(st.kind==='node' && st.i < NODES[k].length-1) next = {lbl:NODES[k][st.i+1].t, act:()=>openPage({kind:'node', k, i:st.i+1}), main:1};
  else if(st.kind==='node') next = {lbl:'Quiz starten', icon:'circle-help', act:()=>openPage({kind:'quiz', k}), main:1};
  if(st.kind==='compare') next = {lbl:'Gemeinsamkeiten und Unterschiede', act:()=>openPage({kind:'compare2'}), main:1};
  if(st.kind==='compare2'){ prev = {lbl:'Vergleich, Teil 1', act:()=>openPage({kind:'compare'})}; next = {lbl:'Ein Beispiel', act:()=>openPage({kind:'compare3'}), main:1}; }
  if(st.kind==='compare3'){ prev = {lbl:'Gemeinsamkeiten und Unterschiede', act:()=>openPage({kind:'compare2'})}; next = {lbl:'Auf einen Blick', act:()=>openPage({kind:'ao'}), main:1}; }
  if(st.kind==='ao'){ prev = {lbl:'Ein Beispiel', act:()=>openPage({kind:'compare3'})}; next = {lbl:'Unser Fazit', icon:'flag', act:()=>openPage({kind:'fazit'}), main:1}; }
  if(st.kind==='fazit') prev = {lbl:'Auf einen Blick', act:()=>openPage({kind:'ao'})};
  const pos = st.kind==='node' ? '<div class="cdots">'+NODES[k].map((_,j)=>'<button aria-label="'+NODES[k][j].t+'" data-dot="'+j+'" class="'+(j===st.i?'on':'')+'"></button>').join('')+'<span>Baustein '+(st.i+1)+' von '+NODES[k].length+'</span></div>' : '<div></div>';
  bar.innerHTML = '<button class="btn ghost" id="dPrev"'+(prev?'':' hidden')+'>'+ic('chevron-left')+'<span class="lbl">'+(prev?prev.lbl:'')+'</span></button>' + pos +
    '<button class="btn'+(next&&next.main?'':' ghost')+'" id="dNext"'+(next?'':' hidden')+'><span class="lbl">'+(next?next.lbl:'')+'</span>'+ic(next&&next.icon?next.icon:'chevron-right')+'</button>';
  if(prev) bar.querySelector('#dPrev').addEventListener('click', prev.act);
  if(next) bar.querySelector('#dNext').addEventListener('click', next.act);
  bar.querySelectorAll('[data-dot]').forEach(b=>b.addEventListener('click',()=>openPage({kind:'node', k, i:+b.dataset.dot})));
}
document.addEventListener('keydown', e=>{
  if(!pageState || pageState.kind==='quiz' || pageState.kind==='sort') return;
  if(e.key==='ArrowRight'){ const b = document.getElementById('dNext'); if(b && !b.hidden) b.click(); }
  if(e.key==='ArrowLeft'){ const b = document.getElementById('dPrev'); if(b && !b.hidden) b.click(); }
});
function navRow(k, i){
  const L = NODES[k], prev = L[i-1], next = L[i+1];
  return '<div class="navrow">' + (prev ? '<button class="btn ghost" data-nav="'+(i-1)+'">'+ic('chevron-left')+prev.t+'</button>' : '<span></span>') +
    (next ? '<button class="btn" data-nav="'+(i+1)+'">'+next.t+ic('chevron-right')+'</button>' : '<button class="btn" data-goto="quiz">'+ic('circle-help')+'Quiz starten</button>') + '</div>';
}
function closePage(){ setPaper(null); stopLibet(); if(SIM && SIM.raf){ cancelAnimationFrame(SIM.raf); SIM.running = false; } sheetToken++; deckState = null; page.classList.remove('show'); pageState = null; const v = page.querySelector('video'); if(v) v.pause(); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && pageState) closePage(); });

function videoBody(){
  const who = k=>'<div class="who3" style="'+cvars(k)+'"><span class="face3">'+portrait(k)+'</span><div><b>'+PH[k].short+'</b><small>'+PH[k].field+', Ebene '+PH[k].level+'</small></div></div>';
  return '<div class="vslot solo" id="vslot"><video controls preload="metadata" playsinline poster="videos/fall-jonas-vorschau.jpg"><source src="'+VIDEO.src+'" type="video/mp4" onerror="videoMissing()"></video></div>' +
    hero(chain([['busts-in-silhouette','Party, Streit'],['high-voltage','Jonas schlägt zu'],['judge','Gericht: Schuld?']]), '<p class="big">Der Fall Jonas K.</p><p>'+FALL+'</p><p>Drei Theorien, drei Erklärungen. Und jede führt zu einer anderen Antwort auf die Schuldfrage.</p>') +
    '<div class="three">' + Object.keys(PH).map(k=>'<button class="tcol gut" data-act="gut" style="'+cvars(k)+'">'+who(k)+'<span class="gut-c">'+ic('eye')+'Gutachten aufdecken</span><span class="gut-t"><b>Warum hat er das getan?</b><br>'+FALL_SICHT[k][0]+'<br><b>Was folgt daraus?</b><br>'+FALL_SICHT[k][1]+'</span></button>').join('') + '</div>' +
    sec('Dein Urteil: Ist Jonas schuldig?','gavel','<div class="rowbtn">'+['schuldig','vermindert schuldig','nicht schuldig'].map((t,i)=>'<button class="btn ghost" data-act="verdict" data-v="'+i+'">'+t+'</button>').join('')+'</div><div class="verdictout" id="verdictOut">Wähl ein Urteil, dann siehst du, wer dir recht geben würde.</div>') +
    quote('Alle drei erklären, warum Jonas zugeschlagen hat. Aber erklären heißt nicht entschuldigen.','Unser Fazit');
}
function videoMissing(){ const slot = document.getElementById('vslot'); if(!slot) return;
  slot.innerHTML = '<div class="vmissing">'+ic('clapperboard')+'<b>'+VIDEO.title+'</b><span>Das Video kommt noch. Datei ablegen unter '+VIDEO.src+'</span></div>'; }

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function runQuiz(k){
  const box = document.getElementById('quizBox'), qs = shuffle(QUIZ[k]); let idx = 0, score = 0; const res = [];
  function step(){
    const q = qs[idx], mix = shuffle(q.o.map((t,i)=>({t, ok:i===q.a})));
    box.innerHTML = '<div class="qmeta"><span>Frage '+(idx+1)+' von '+qs.length+'</span><span>'+score+' richtig</span></div><div class="qdots">'+qs.map((_,i)=>'<i class="'+(i<idx?(res[i]?'ok':'bad'):(i===idx?'cur':''))+'"></i>').join('')+'</div>' +
      '<div class="qcard"><p class="qtext">'+q.q+'</p><div class="opts">'+mix.map((o,i)=>'<button class="opt" data-i="'+i+'"><span class="k">'+'ABCD'[i]+'</span>'+o.t+'</button>').join('')+'</div><div id="qnext"></div></div>';
    box.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
      const ok = mix[+b.dataset.i].ok; res[idx] = ok; if(ok) score++;
      box.querySelectorAll('.opt').forEach((x,i)=>{ x.disabled = true; if(mix[i].ok) x.classList.add('correct'); else if(x===b) x.classList.add('wrong'); });
      box.querySelector('#qnext').innerHTML = '<div style="margin-top:18px">'+note(ok?'good':'warn', ok?'Richtig':'Knapp daneben', q.e)+'</div><div style="text-align:right;margin-top:16px"><button class="btn" id="qGo">'+(idx+1<qs.length?'Nächste Frage':'Ergebnis ansehen')+ic('chevron-right')+'</button></div>';
      box.querySelector('#qGo').addEventListener('click',()=>{ idx++; if(idx<qs.length) step(); else end(); });
    }));
  }
  function end(){
    const pct = score/qs.length, msg = QUIZ_END[k][pct>=.85?0:pct>=.5?1:2];
    box.innerHTML = '<div class="qcard qend"><div class="big">'+score+'/'+qs.length+'</div><p class="qtext" style="margin:12px 0 0">'+msg+'</p><div style="display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap"><button class="btn" id="qAgain">'+ic('rotate-ccw')+'Noch eine Runde</button><button class="btn ghost" id="qBack">'+ic('arrow-left')+'Zurück zu '+PH[k].short+'</button></div></div>';
    box.querySelector('#qAgain').addEventListener('click', ()=>runQuiz(k));
    box.querySelector('#qBack').addEventListener('click', closePage);
  }
  step();
}

const PERIOD = 2560; let t0 = 0, libetAngle = 0;
function startLibet(){
  const clock = document.getElementById('libetClock'); let h = ''; const r = clock.offsetWidth/2;
  for(let i=0;i<12;i++) h += '<span class="tick" style="transform:rotate('+(i*30)+'deg) translateY(-'+(r-14)+'px)"></span>';
  clock.innerHTML = h + '<span class="dot" id="libetDot"></span>';
  t0 = performance.now(); const dot = document.getElementById('libetDot'), rr = r-30;
  const step = now=>{ libetAngle = ((now-t0)%PERIOD)/PERIOD*360; dot.style.transform='rotate('+libetAngle+'deg) translateY(-'+rr+'px)'; libetTimer = requestAnimationFrame(step); };
  libetTimer = requestAnimationFrame(step);
}
function stopLibet(){ if(libetTimer){ cancelAnimationFrame(libetTimer); libetTimer=null; } }
function libetClick(){
  const clock = document.getElementById('libetClock'); if(!clock) return;
  clock.querySelectorAll('.mark').forEach(m=>m.remove());
  const rr = clock.offsetWidth/2-30, a = libetAngle, bp = a - 350/PERIOD*360;
  clock.insertAdjacentHTML('beforeend','<span class="mark" style="border-color:#29507e;transform:rotate('+a+'deg) translateY(-'+rr+'px)"></span><span class="mark" style="border-color:#e6be55;background:#fbf2d6;transform:rotate('+bp+'deg) translateY(-'+rr+'px)"></span>');
  document.getElementById('libetOut').innerHTML = note('theory','Dein Ergebnis','Du hast dich bei <b>'+(a/360*PERIOD/1000).toFixed(2)+' s</b> entschieden (blauer Ring). Laut Libet hätte dein Bereitschaftspotential schon etwa <b>350 ms früher</b> begonnen, beim gelben Punkt.') + '<div style="height:10px"></div>' + note('warn','Aber','Du hast dich vorher bewusst entschieden mitzumachen und hättest den Klick noch stoppen können.');
}
let boxState = {plan:'immer', n:0, food:0};
function boxOut(msg){ const names = {immer:'immer Futter', zufall:'unregelmäßig', nie:'Löschung'};
  document.getElementById('boxOut').innerHTML = (msg?'<b style="color:var(--cd);font-size:1.4em;font-family:var(--display)">'+msg+'</b><br>':'')+'Plan: '+names[boxState.plan]+', '+boxState.n+' Drücke, '+boxState.food+' Futter'; }
page.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  if(b.dataset.act==='rev'){ b.classList.add('open'); }
  if(b.dataset.act==='step'){ const h = page.querySelector('#rsteps .hid'); if(h){ page.querySelectorAll('#rsteps .cur').forEach(x=>x.classList.remove('cur')); h.classList.remove('hid'); h.classList.add('cur'); } }
  if(b.dataset.act==='stepall'){ page.querySelectorAll('#rsteps .hid').forEach(l=>l.classList.remove('hid')); page.querySelectorAll('#rsteps .cur').forEach(x=>x.classList.remove('cur')); }
  if(b.dataset.act==='stepreset'){ page.querySelectorAll('#rsteps .stepcard').forEach((x,i)=>{ x.classList.toggle('hid', i>0); x.classList.toggle('cur', i===0); }); }
  if(b.dataset.act==='simplan'){ page.querySelectorAll('.planbtn').forEach(x=>x.classList.toggle('on', x===b)); if(SIM && SIM.raf) cancelAnimationFrame(SIM.raf); SIM = {plan:b.dataset.p}; simReset(); }
  if(b.dataset.act==='simstart'){ simStart(); }
  if(b.dataset.act==='simreset'){ simReset(); }
  if(b.dataset.act==='pick'){ const q = b.closest('.pq'); if(q.classList.contains('done')) return; q.classList.add('done');
    const ok = +b.dataset.j === +q.dataset.a; b.classList.add(ok?'ok':'bad'); q.querySelectorAll('.pq-o button')[+q.dataset.a].classList.add('ok');
    const f = q.querySelector('.pq-f'); f.innerHTML = '<b>'+(ok?'Richtig.':'Knapp daneben.')+'</b> '+f.dataset.e; }
  if(b.dataset.act==='scene'){ page.querySelectorAll('[data-act="scene"]').forEach(x=>x.classList.toggle('ghost', x!==b)); page.querySelector('#scenebox').innerHTML = sceneHTML(+b.dataset.i); }
  if(b.dataset.act==='gut'){ b.classList.add('open'); }
  if(b.dataset.act==='go'){ openPage({kind:b.dataset.k}); }
  if(b.dataset.act==='verdict'){ page.querySelectorAll('[data-act="verdict"]').forEach(x=>x.classList.toggle('ghost', x!==b)); page.querySelector('#verdictOut').innerHTML = VERDICT[+b.dataset.v]; }
  if(b.dataset.act==='libet') libetClick();
  if(b.dataset.act==='plan'){ boxState = {plan:b.dataset.p, n:0, food:0}; boxOut(); }
  if(b.dataset.act==='lever'){ boxState.n++; const hit = boxState.plan==='immer' ? true : boxState.plan==='zufall' ? Math.random()<0.3 : false; if(hit) boxState.food++;
    let msg = hit ? 'Futter!' : 'Nichts.'; if(boxState.plan==='nie' && boxState.n>=6) msg = 'Immer noch nichts. Das ist Löschung. Lust aufzuhören?';
    if(boxState.plan==='zufall' && boxState.n===10) msg += ' Merkst du, wie man trotzdem weiterdrückt?'; boxOut(msg); }
});

page.addEventListener('input', e=>{
  if(e.target.id==='freeSl'){ const v = +e.target.value; page.querySelector('#freeV').innerHTML = v+'<small>von 10</small>'; page.querySelector('#freeOut').innerHTML = freeText(v); }
});
let rsT = null;
window.addEventListener('resize', ()=>{ if(BGFX.dataset.k) setTheme(BGFX.dataset.k); clearTimeout(rsT); rsT = setTimeout(()=>{ if(pageState && deckState) fitSheet(); if(busy) return; vp.innerHTML='';
  if(current){ const dt = buildDetail(current); vp.appendChild(dt); dt.classList.add('ready');
    dt.querySelectorAll('.node').forEach(n=>{ n.style.transition='none'; n.style.left=n.dataset.x+'%'; n.style.top=n.dataset.y+'%'; n.style.opacity=1; });
    dt.querySelectorAll('line[data-x]').forEach(l=>{ l.setAttribute('x2',l.dataset.x); l.setAttribute('y2',l.dataset.y); });
    requestAnimationFrame(()=>dt.querySelectorAll('.node').forEach(n=>n.style.transition=''));
  } else { const ov = buildOverview(); vp.appendChild(ov); drawThreads(ov); } }, 150); });
updFS(); renderOverview();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ const ov = vp.querySelector('.stage'); if(ov && !current) drawThreads(ov); });
window.addEventListener('load', ()=>{ const ov = vp.querySelector('.stage'); if(ov && !current) drawThreads(ov); });
</script>
