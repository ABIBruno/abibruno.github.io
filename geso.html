<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABIdasmuss | Geso</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#05070f">
<script>try{if(localStorage.getItem('abi-theme')==='light')document.documentElement.dataset.theme='light'}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070f;--panel:#11151f;--line:#262d3d;--text:#dfe6f3;--muted:#8b95ab;--green:#5be3a1}
:root[data-theme="light"]{--bg:#eef2f9;--panel:#ffffff;--line:#d5dcea;--text:#151a26;--muted:#5a6478}
*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;background:radial-gradient(ellipse at 50% -10%,rgba(91,227,161,.12),transparent 60%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;text-align:center}
.box{max-width:460px;padding:40px 26px;border-radius:22px;background:var(--panel);border:1px solid var(--line)}
h1{font-family:Orbitron,sans-serif;font-weight:900;color:var(--green);letter-spacing:.08em;margin:10px 0}
p{color:var(--muted);line-height:1.6}
a{display:inline-block;margin-top:14px;padding:10px 22px;border-radius:999px;border:1px solid var(--green);color:var(--green);text-decoration:none;font-weight:500}
</style>
</head>
<body>
<div class="box">
  <div style="font-size:2.6rem">🩺</div>
  <h1>GESO</h1>
  <p>Der Trainer für Gesundheit und Soziales (Leistungskurs, Abiturprüfungen 2017–2026) ist gerade im Aufbau.</p>
  <a href="./">← Zurück zur Auswahl</a>
</div>
</body>
</html>
