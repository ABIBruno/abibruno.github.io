<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://abidasmuss-upload.brunokmoch08.workers.dev; frame-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>ABIdasmuss | Abiturtrainer</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#05070f">
<script>
/* Alte Links wie abibruno.github.io/#/lb/2/... weiterhin direkt zum VBWL-Trainer leiten */
if (location.hash && location.hash.indexOf('#/') === 0) location.replace('vbwl.html' + location.hash);
try{if(localStorage.getItem('abi-theme')==='light')document.documentElement.dataset.theme='light'}catch(e){}
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--bg:#05070f;--panel:#11151f;--line:#262d3d;--text:#dfe6f3;--muted:#8b95ab;--cyan:#38d6ff;--violet:#b58cff;--pink:#f08ad8;--green:#5be3a1;
--grad:linear-gradient(90deg,var(--cyan) 0%,#9ad8ff 45%,var(--violet) 70%,var(--pink) 100%)}
:root[data-theme="light"]{--bg:#eef2f9;--panel:#ffffff;--line:#d5dcea;--text:#151a26;--muted:#5a6478}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% -10%,rgba(56,214,255,.12),transparent 60%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 16px;text-align:center}
h1{font-family:Orbitron,sans-serif;font-weight:900;font-size:clamp(2rem,7vw,3.6rem);letter-spacing:.06em;margin:0 0 10px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
p.sub{color:var(--muted);margin:0 0 44px;font-size:1.05rem}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,260px));gap:22px;width:100%;justify-content:center}
.card{display:flex;flex-direction:column;align-items:center;gap:10px;padding:34px 20px;border-radius:22px;background:var(--panel);border:1px solid var(--line);color:var(--text);text-decoration:none;transition:transform .15s,border-color .15s,box-shadow .15s}
.card:hover,.card:focus-visible{transform:translateY(-4px);outline:none}
.card .ico{font-size:2.6rem}
.card .name{font-family:Orbitron,sans-serif;font-weight:700;font-size:1.6rem;letter-spacing:.08em}
.card .desc{color:var(--muted);font-size:.92rem}
.vbwl:hover,.vbwl:focus-visible{border-color:var(--cyan);box-shadow:0 0 34px rgba(56,214,255,.25)}
.vbwl .name{color:var(--cyan)}
.geso:hover,.geso:focus-visible{border-color:var(--green);box-shadow:0 0 34px rgba(91,227,161,.25)}
.geso .name{color:var(--green)}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:20px 16px;letter-spacing:.05em}
footer a{color:var(--muted)}
@media (max-width:560px){.choices{grid-template-columns:1fr;max-width:340px}}
</style>
</head>
<body>
<main>
  <h1>ABIDASMUSS</h1>
  <p class="sub">Wähle dein Fach</p>
  <nav class="choices">
    <a class="card vbwl" href="vbwl.html"><span class="ico">📊</span><span class="name">VBWL</span><span class="desc">Volks- und Betriebswirtschaftslehre</span></a>
    <a class="card geso" href="geso/"><span class="ico">🩺</span><span class="name">GESO</span><span class="desc">Gesundheit und Soziales</span></a>
  </nav>
</main>
<footer>© 2026 ABIDASMUSS · <a href="vbwl.html">Hinweis &amp; Datenschutz siehe VBWL-Seite</a></footer>
</body>
</html>
